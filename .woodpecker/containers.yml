# Real port of .github/workflows/ci-cd.yml's application-container-build and
# progressive-manifest-verify jobs -- same commands, run on itunda's own Woodpecker
# infrastructure instead of a GitHub-hosted runner. See lint-and-typecheck.yml's own
# doc comment for the overall GitHub-Actions-stays / Woodpecker-runs-in-parallel
# architecture.
#
# application-container-build needs a real `docker build`, unlike every other step in
# .woodpecker/* -- the standard Woodpecker pattern for this (a docker:cli image with
# the HOST's own docker.sock mounted in, per infra/ci/docker-compose.yml's own agent
# already doing exactly that mount) rather than Docker-in-Docker. Confirmed against
# Woodpecker's own docs (woodpecker-ci.org/docs/usage/volumes) that this exact
# volumes: syntax is correct -- but that same page states host volume mounts are
# GATED behind "trusted" mode, which is off by default and must be explicitly
# enabled per-repo in the Woodpecker UI's project settings before this step will
# work at all. Whoever does the initial Woodpecker setup (docs/CI_WOODPECKER_SETUP.md)
# needs to flip that setting for this repo. Not yet live-tested against a real
# running Woodpecker instance (server/agent aren't deployed anywhere yet), so
# verify this step specifically once Woodpecker is actually live.
labels:
  backend: docker

steps:
  - name: application-container-build-api-gateway
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --tag itunda/api-gateway:ci --file services/api-gateway/Dockerfile services/api-gateway
    when:
      - event: [push, pull_request]

  - name: application-container-build-backend
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --tag itunda/backend:ci --file services/backend/Dockerfile services/backend
    when:
      - event: [push, pull_request]

  - name: application-container-build-ledger-service
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --tag itunda/ledger-service:ci --file services/microservices/ledger-service/Dockerfile services/microservices
    when:
      - event: [push, pull_request]

  - name: application-container-build-payment-service
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --tag itunda/payment-service:ci --file services/microservices/payment-service/Dockerfile services/microservices
    when:
      - event: [push, pull_request]

  - name: progressive-manifest-verify
    image: python:3.12-slim
    commands:
      - bash scripts/verify-progressive-images.sh
      - bash scripts/verify-api-gateway-runtime-security.sh
    when:
      - event: [push, pull_request]
