name: Android PR Validation

on:
  pull_request:
    paths:
      - "android/**"
      - "packages/saronite/**"
      - ".github/workflows/android-pr.yml"
  push:
    branches:
      - "main"
    paths:
      - "android/**"
      - "packages/saronite/**"
      - ".github/workflows/android-pr.yml"
  workflow_dispatch:

concurrency:
  group: android-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # Do not use setup-node's Yarn cache here: it invokes global Yarn before Corepack is enabled.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: yarn install --no-immutable

      - name: Verify dependency catalog usage
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE '^[[:space:]]*(implementation|api|runtimeOnly|compileOnly|testImplementation|androidTestImplementation|kapt|ksp)[[:space:]]*\("[^"]*:[0-9][^"]*"\)' android --include='*.gradle' --include='*.gradle.kts'; then
            echo "Found a hard-coded Android dependency version using double-quoted notation."
            echo "Use android/gradle/libs.versions.toml instead."
            exit 1
          fi

          if grep -RInE "^[[:space:]]*(implementation|api|runtimeOnly|compileOnly|testImplementation|androidTestImplementation|kapt|ksp)[[:space:]]*\\('[^']*:[^']*\\')" android --include='*.gradle' --include='*.gradle.kts'; then
            echo "Found a hard-coded Android dependency version using single-quoted notation."
            echo "Use android/gradle/libs.versions.toml instead."
            exit 1
          fi

          if grep -RInE '^[[:space:]]*platform[[:space:]]*\("[^"]*:[0-9][^"]*"\)' android --include='*.gradle' --include='*.gradle.kts'; then
            echo "Found a hard-coded platform dependency version."
            echo "Use android/gradle/libs.versions.toml instead."
            exit 1
          fi

          echo "Android dependency versions are catalog-backed in dependency declarations."

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Validate Gradle configuration
        working-directory: android
        run: ./gradlew help --stacktrace

      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -PdemoMode=true --stacktrace

      # Picker and Business are parked while the itunda app is brought to prototype parity: skipped on the
      # prototype branch so its builds stay fast; every other branch still builds them.
      - name: Assemble Picker and Business debug APKs
        if: ${{ !(github.head_ref == 'integration/prototype-parity' || github.ref == 'refs/heads/integration/prototype-parity') }}
        working-directory: android
        run: ./gradlew :riderapp:assembleDebug :merchantapp:assembleDebug --stacktrace

      - name: Run Android unit tests (itunda app only on the prototype branch)
        working-directory: android
        run: |
          if [ "${{ github.head_ref }}" = "integration/prototype-parity" ] || [ "${{ github.ref }}" = "refs/heads/integration/prototype-parity" ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            ./gradlew testDebugUnitTest --stacktrace
          fi

      - name: Upload validated Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: itunda-android-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Picker and Business debug APKs
        if: ${{ !(github.head_ref == 'integration/prototype-parity' || github.ref == 'refs/heads/integration/prototype-parity') }}
        uses: actions/upload-artifact@v4
        with:
          name: itunda-picker-business-debug-${{ github.run_number }}
          path: |
            android/riderapp/build/outputs/apk/debug/*.apk
            android/merchantapp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # Phone-friendly download: the prototype-parity integration branch publishes its APKs as a
      # rolling pre-release, so testers tap the file on the Releases page instead of unzipping an artifact.
      - name: Publish prototype APKs to the rolling pre-release
        if: github.head_ref == 'integration/prototype-parity' || github.ref == 'refs/heads/integration/prototype-parity'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rel
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/rel/itunda-app.apk
          gh release delete prototype-latest --yes --cleanup-tag || true
          gh release create prototype-latest /tmp/rel/*.apk --prerelease --target "${GITHUB_SHA}" \
            --title "Prototype parity build #${{ github.run_number }}" \
            --notes "Debug builds with demo data. Commit ${GITHUB_SHA::7}. Install over the previous version."
