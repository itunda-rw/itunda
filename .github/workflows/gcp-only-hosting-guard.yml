name: GCP-only hosting guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reject-legacy-pages-links:
    name: Reject newly added legacy Pages links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject newly added pages.dev URLs
        run: bash scripts/check-no-pages-dev-links.sh
