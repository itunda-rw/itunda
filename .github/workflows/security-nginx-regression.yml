name: Security Nginx Regression

on:
  pull_request:
    paths:
      - "services/micro-frontends/nginx.conf"
      - "services/micro-frontends/scripts/test-nginx-hidden-files.sh"
      - ".github/workflows/security-nginx-regression.yml"
      - "services/backend/**/application.yml"
      - "services/backend/auth/src/main/kotlin/rw/itunda/auth/JwtService.kt"
      - "scripts/test-jwt-secret-config.sh"
  push:
    branches: [main]
    paths:
      - "services/micro-frontends/nginx.conf"
      - "services/micro-frontends/scripts/test-nginx-hidden-files.sh"
      - ".github/workflows/security-nginx-regression.yml"
      - "services/backend/**/application.yml"
      - "services/backend/auth/src/main/kotlin/rw/itunda/auth/JwtService.kt"
      - "scripts/test-jwt-secret-config.sh"

permissions:
  contents: read

jobs:
  nginx-hidden-file-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test Nginx hidden-file denial and SPA fallback
        run: bash services/micro-frontends/scripts/test-nginx-hidden-files.sh
      - name: Test JWT secret fail-closed configuration
        run: bash scripts/test-jwt-secret-config.sh
