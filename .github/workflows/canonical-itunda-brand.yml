name: canonical Itunda brand assets

on:
  push:
    branches: [main]
    paths:
      - 'itunda-brand-v3.zip'
      - 'packages/brand-assets/**'
      - 'scripts/sync-native-brand-assets.sh'
      - 'scripts/verify-native-brand-assets.py'
      - '.github/workflows/canonical-itunda-brand.yml'
  pull_request:
    paths:
      - 'itunda-brand-v3.zip'
      - 'packages/brand-assets/**'
      - '.github/workflows/canonical-itunda-brand.yml'
      - 'client/public/brand/**'
      - 'services/micro-frontends/host-app/public/brand/**'
      - 'client/brand/**'
      - 'ios/Assets/ItundaIcon.svg'
      - 'business/brand/**'
      - 'business/developers/brand/**'
      - 'services/blog/public/brand/**'
      - 'site/brand/**'
      - 'sites/public/brand/**'
      - 'site/favicon.svg'
      - 'business/favicon.svg'
      - 'business/developers/favicon.svg'
      - 'services/micro-frontends/**/public/favicon.svg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-itunda-brand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v3 archive identity
        env:
          EXPECTED_BLOB_SHA: e892fb5f0c5ea1f0cea994665f31302b25e8a5e7
          EXPECTED_SIZE: '46747'
        run: |
          set -euo pipefail
          test -s itunda-brand-v3.zip
          test "$(stat -c '%s' itunda-brand-v3.zip)" = "$EXPECTED_SIZE"
          test "$(git rev-parse HEAD:itunda-brand-v3.zip)" = "$EXPECTED_BLOB_SHA"
          unzip -t itunda-brand-v3.zip
          sha256sum itunda-brand-v3.zip | tee /tmp/itunda-brand-v3.zip.sha256

      - name: Install exact v3 files into canonical package
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf /tmp/itunda-brand-v3
          mkdir -p /tmp/itunda-brand-v3 packages/brand-assets/canonical/itunda-brand
          unzip -q itunda-brand-v3.zip -d /tmp/itunda-brand-v3
          test -d /tmp/itunda-brand-v3/itunda-brand-v3
          rsync -a --delete /tmp/itunda-brand-v3/itunda-brand-v3/ packages/brand-assets/canonical/itunda-brand/
          cp /tmp/itunda-brand-v3.zip.sha256 /tmp/itunda-brand-v3.sha256
          cut -d' ' -f1 /tmp/itunda-brand-v3.sha256 > packages/brand-assets/CANONICAL_ZIP_SHA256
          printf '%s\n' '# Canonical Itunda brand assets' '' 'Canonical source: `itunda-brand-v3.zip`.' '' 'Files under `canonical/itunda-brand/` are byte-for-byte copies of the v3 archive.' '' 'Do not redraw, recolor, optimize, reformat, or independently edit canonical assets.' > packages/brand-assets/README.md
          (cd packages/brand-assets/canonical/itunda-brand && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  ./#  packages/brand-assets/canonical/itunda-brand/#') > packages/brand-assets/SHA256SUMS

      - name: Sync canonical v3 assets to product launch surfaces
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          root=packages/brand-assets/canonical/itunda-brand
          symbol="$root/symbol/itunda-symbol.svg"
          favicon="$root/app-icons/itunda-favicon.svg"
          app_icon="$root/app-icons/itunda-app-icon.svg"
          splash_light="$root/splash/itunda-splash-light.svg"
          splash_dark="$root/splash/itunda-splash-dark.svg"
          for f in "$symbol" "$favicon" "$app_icon" "$splash_light" "$splash_dark"; do test -s "$f"; done
          copy_asset() { mkdir -p "$(dirname "$2")"; cp "$1" "$2"; }
          for dst in client/brand/itunda-icon.svg ios/Assets/ItundaIcon.svg services/blog/public/brand/itunda-icon.svg business/brand/itunda-icon.svg business/developers/brand/itunda-icon.svg site/brand/itunda-symbol.svg sites/public/brand/itunda-symbol.svg; do copy_asset "$symbol" "$dst"; done
          copy_asset "$favicon" site/favicon.svg
          for dst in business/favicon.svg business/developers/favicon.svg services/micro-frontends/host-app/public/favicon.svg services/micro-frontends/bank-mfe/public/favicon.svg services/micro-frontends/merchant-mfe/public/favicon.svg services/micro-frontends/maps-mfe/public/favicon.svg services/micro-frontends/kyc-mfe/public/favicon.svg services/micro-frontends/ops-mfe/public/favicon.svg; do copy_asset "$favicon" "$dst"; done
          for base in client/public/brand services/micro-frontends/host-app/public/brand; do
            copy_asset "$app_icon" "$base/itunda-app-icon.svg"
            copy_asset "$splash_light" "$base/itunda-splash-light.svg"
            copy_asset "$splash_dark" "$base/itunda-splash-dark.svg"
          done

      - name: Render native launcher icons from canonical SVG
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          bash scripts/sync-native-brand-assets.sh
          rsvg-convert --format=png --width=108 --height=108 packages/brand-assets/canonical/itunda-brand/app-icons/itunda-android-adaptive-foreground.svg > android/app/src/main/res/drawable/itunda_adaptive_foreground.png

      - name: Verify archive and every deployed brand copy
        run: |
          set -euo pipefail
          test "$(sha256sum itunda-brand-v3.zip | cut -d' ' -f1)" = "$(cat packages/brand-assets/CANONICAL_ZIP_SHA256)"
          sha256sum --check packages/brand-assets/SHA256SUMS
          root=packages/brand-assets/canonical/itunda-brand
          cmp -s "$root/symbol/itunda-symbol.svg" client/brand/itunda-icon.svg
          cmp -s "$root/symbol/itunda-symbol.svg" ios/Assets/ItundaIcon.svg
          cmp -s "$root/symbol/itunda-symbol.svg" services/blog/public/brand/itunda-icon.svg
          cmp -s "$root/symbol/itunda-symbol.svg" business/brand/itunda-icon.svg
          cmp -s "$root/symbol/itunda-symbol.svg" business/developers/brand/itunda-icon.svg
          cmp -s "$root/symbol/itunda-symbol.svg" site/brand/itunda-symbol.svg
          cmp -s "$root/symbol/itunda-symbol.svg" sites/public/brand/itunda-symbol.svg
          cmp -s "$root/app-icons/itunda-favicon.svg" site/favicon.svg
          for f in business/favicon.svg business/developers/favicon.svg services/micro-frontends/host-app/public/favicon.svg services/micro-frontends/bank-mfe/public/favicon.svg services/micro-frontends/merchant-mfe/public/favicon.svg services/micro-frontends/maps-mfe/public/favicon.svg services/micro-frontends/kyc-mfe/public/favicon.svg services/micro-frontends/ops-mfe/public/favicon.svg; do cmp -s "$root/app-icons/itunda-favicon.svg" "$f"; done
          for base in client/public/brand services/micro-frontends/host-app/public/brand; do
            cmp -s "$root/app-icons/itunda-app-icon.svg" "$base/itunda-app-icon.svg"
            cmp -s "$root/splash/itunda-splash-light.svg" "$base/itunda-splash-light.svg"
            cmp -s "$root/splash/itunda-splash-dark.svg" "$base/itunda-splash-dark.svg"
          done
          python3 scripts/verify-native-brand-assets.py
          echo 'Canonical v3 archive, manifest, symbol, favicon, web launch assets, and native launcher raster dimensions verified.'

      - name: Commit canonical v3 sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/res/mipmap-* android/app/src/main/res/drawable/itunda_adaptive_foreground.png ios/App/Resources/Assets.xcassets/AppIcon.appiconset packages/brand-assets client/brand client/public/brand ios/Assets/ItundaIcon.svg services/blog/public/brand business/brand business/developers/brand site/brand sites/public/brand site/favicon.svg business/favicon.svg business/developers/favicon.svg services/micro-frontends
          if git diff --cached --quiet; then echo 'Canonical v3 assets already synchronized.'; exit 0; fi
          git commit -m 'build(brand): adopt canonical Itunda brand v3 assets'
          # Other main-branch workflows can commit while this rasterization runs.
          # Rebase the generated asset commit onto the latest main before pushing.
          git pull --rebase origin main
          git push
