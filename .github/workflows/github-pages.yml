name: Deploy Itunda Client to GitHub Pages

on:
  # GitHub Pages deployment remains available manually when hosted runners are restored.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload client artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy client
        id: deployment
        uses: actions/deploy-pages@v4
