name: IDS audit

on:
  pull_request:
    paths:
      - "services/micro-frontends/**"
      - "packages/design-system-web/**"
      - "packages/design-tokens/**"
      - "design-system/components/**"
      - "scripts/audit-ids.mjs"
      - "package.json"
      - "yarn.lock"
  push:
    branches:
      - agent/itunda-agent-network
    paths:
      - "services/micro-frontends/**"
      - "packages/design-system-web/**"
      - "packages/design-tokens/**"
      - "design-system/components/**"
      - "scripts/audit-ids.mjs"
      - "package.json"
      - "yarn.lock"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn audit:ids
