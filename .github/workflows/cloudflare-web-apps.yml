name: Deploy Itunda Web Apps to Cloudflare Pages
# GitHub-hosted runner path is active; deploy directly from the public repository.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - agent/itunda-agent-network
  workflow_dispatch:
    inputs:
      app:
        description: "Cloudflare Pages app to deploy"
        required: true
        type: choice
        options:
          - customer
          - business

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-web-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'agent/itunda-agent-network') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ matrix.app == 'customer' && 'https://itunda-app.pages.dev' || 'https://itunda-business-app.pages.dev' }}
    concurrency:
      group: itunda-production-web
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        app: [customer, business]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_API_BASE_URL: https://itunda.duckdns.org
    steps:
      - name: Checkout CI-verified commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Enable Corepack
        run: corepack enable

      - name: Build customer web app
        if: matrix.app == 'customer' && (github.event_name == 'workflow_run' || inputs.app == 'customer')
        run: bash scripts/cloudflare-build-web-app.sh customer

      - name: Build business web app
        if: matrix.app == 'business' && (github.event_name == 'workflow_run' || inputs.app == 'business')
        run: bash scripts/cloudflare-build-web-app.sh business

      - name: Ensure customer Pages project
        if: matrix.app == 'customer' && (github.event_name == 'workflow_run' || inputs.app == 'customer')
        run: npx --yes wrangler@4.39.0 pages project create itunda-app --production-branch agent/itunda-agent-network || true

      - name: Deploy customer web app
        if: matrix.app == 'customer' && (github.event_name == 'workflow_run' || inputs.app == 'customer')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy services/micro-frontends/host-app/dist --project-name=itunda-app --branch=agent/itunda-agent-network --commit-message="Deploy customer web app"

      - name: Browser smoke test customer production
        if: matrix.app == 'customer' && (github.event_name == 'workflow_run' || inputs.app == 'customer')
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const pageErrors=[]; const consoleErrors=[];
          const page = await browser.newPage({viewport:{width:390,height:844}});
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          await page.goto('https://itunda-app.pages.dev/', {waitUntil:'networkidle', timeout:60000});
          const tab = page.getByRole('tab', {name:/home/i});
          if (!(await tab.count())) throw new Error('Customer Home tab not rendered');
          if (!(await page.getByRole('tab', {name:/identity/i}).count())) throw new Error('Customer Identity tab not rendered');
          await tab.click();
          if (!(await page.getByRole('tabpanel').count())) throw new Error('Customer tab panel missing');
          await page.screenshot({path:'/tmp/customer-production.png',fullPage:true});
          if (pageErrors.length || consoleErrors.length) throw new Error('Customer browser errors: '+JSON.stringify({pageErrors,consoleErrors}));
          await page.emulateMedia({colorScheme:'dark'});
          await page.reload({waitUntil:'networkidle', timeout:60000});
          if (!(await page.getByRole('tab', {name:/home/i}).count())) throw new Error('Customer dark-mode render failed');
          await browser.close();
          EOF

      - name: Upload customer production evidence
        if: always() && matrix.app == 'customer' && (github.event_name == 'workflow_run' || inputs.app == 'customer')
        uses: actions/upload-artifact@v4
        with:
          name: customer-production-smoke-${{ github.run_id }}
          path: |
            /tmp/customer-production.png
            /tmp/customer.html
            /tmp/customer.js
          if-no-files-found: ignore
          retention-days: 14

      - name: Smoke test customer production
        if: matrix.app == 'customer' && (github.event_name == 'workflow_run' || inputs.app == 'customer')
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 30 https://itunda-app.pages.dev/ > /tmp/customer.html; then break; fi
            sleep 5
          done
          test -s /tmp/customer.html
          grep -Eiq '<(html|body|div|main|script)[ >]' /tmp/customer.html
          test "$(grep -Eo '/assets/[^"]+\\.js' /tmp/customer.html | head -n 1)" != ""
          customer_js="$(grep -Eo '/assets/[^"]+\\.js' /tmp/customer.html | head -n 1)"
          curl --fail --silent --show-error --location --max-time 30 "https://itunda-app.pages.dev${customer_js}" > /tmp/customer.js
          grep -q 'consumer-bank-tab' /tmp/customer.js
          echo "Customer production smoke test passed"

      - name: Ensure business Pages project
        if: matrix.app == 'business' && (github.event_name == 'workflow_run' || inputs.app == 'business')
        run: npx --yes wrangler@4.39.0 pages project create itunda-business-app --production-branch agent/itunda-agent-network || true

      - name: Deploy business web app
        if: matrix.app == 'business' && (github.event_name == 'workflow_run' || inputs.app == 'business')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy services/micro-frontends/merchant-mfe/dist --project-name=itunda-business-app --branch=agent/itunda-agent-network --commit-message="Deploy business web app"

      - name: Browser smoke test business production
        if: matrix.app == 'business' && (github.event_name == 'workflow_run' || inputs.app == 'business')
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const pageErrors=[]; const consoleErrors=[];
          const page = await browser.newPage({viewport:{width:390,height:844}});
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          await page.goto('https://itunda-business-app.pages.dev/', {waitUntil:'networkidle', timeout:60000});
          const bodyText = (await page.locator('body').innerText()).trim();
          if (!bodyText) throw new Error('Business production rendered empty');
          const interactive = await page.locator('button, a, input, select, textarea').count();
          if (!interactive) throw new Error('Business production has no interactive controls');
          await page.screenshot({path:'/tmp/business-production.png',fullPage:true});
          if (pageErrors.length || consoleErrors.length) throw new Error('Business browser errors: '+JSON.stringify({pageErrors,consoleErrors}));
          await page.emulateMedia({colorScheme:'dark'});
          await page.reload({waitUntil:'networkidle', timeout:60000});
          const darkBodyText = (await page.locator('body').innerText()).trim();
          if (!darkBodyText) throw new Error('Business dark-mode render failed');
          await browser.close();
          EOF

      - name: Upload business production evidence
        if: always() && matrix.app == 'business' && (github.event_name == 'workflow_run' || inputs.app == 'business')
        uses: actions/upload-artifact@v4
        with:
          name: business-production-smoke-${{ github.run_id }}
          path: |
            /tmp/business-production.png
            /tmp/business.html
            /tmp/business.js
          if-no-files-found: ignore
          retention-days: 14

      - name: Smoke test business production
        if: matrix.app == 'business' && (github.event_name == 'workflow_run' || inputs.app == 'business')
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 30 https://itunda-business-app.pages.dev/ > /tmp/business.html; then break; fi
            sleep 5
          done
          test -s /tmp/business.html
          grep -Eiq '<(html|body|div|main|script)[ >]' /tmp/business.html
          test "$(grep -Eo '/assets/[^"]+\\.js' /tmp/business.html | head -n 1)" != ""
          business_js="$(grep -Eo '/assets/[^"]+\\.js' /tmp/business.html | head -n 1)"
          curl --fail --silent --show-error --location --max-time 30 "https://itunda-business-app.pages.dev${business_js}" > /tmp/business.js
          test -s /tmp/business.js
          echo "Business production smoke test passed"
