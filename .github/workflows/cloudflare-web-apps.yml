name: Deploy Itunda Web Apps to Cloudflare Pages

on:
  # GitHub-hosted runner provisioning is currently unavailable for the Itunda
  # Enterprise trial. Keep deployment manual until hosted Actions entitlement
  # is restored.
  workflow_dispatch:
    inputs:
      app:
        description: "Cloudflare Pages app to deploy"
        required: true
        type: choice
        options:
          - customer
          - business

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Enable Corepack
        run: corepack enable

      - name: Build customer web app
        if: inputs.app == 'customer'
        run: bash scripts/cloudflare-build-web-app.sh customer

      - name: Build business web app
        if: inputs.app == 'business'
        run: bash scripts/cloudflare-build-web-app.sh business

      - name: Deploy customer web app
        if: inputs.app == 'customer'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy services/micro-frontends/host-app/dist --project-name=itunda-app --branch=agent/itunda-agent-network --commit-message="Deploy customer web app"

      - name: Deploy business web app
        if: inputs.app == 'business'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy services/micro-frontends/merchant-mfe/dist --project-name=itunda-business-app --branch=agent/itunda-agent-network --commit-message="Deploy business web app"
