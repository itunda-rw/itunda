name: Deploy Itunda Web Apps to Cloudflare Pages

on:
  push:
    branches:
      - agent/itunda-agent-network
    paths:
      - "services/micro-frontends/**"
      - "packages/**"
      - "scripts/cloudflare-build-web-app.sh"
      - "package.json"
      - "yarn.lock"
      - ".yarn/**"
      - ".github/workflows/cloudflare-web-apps.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "Cloudflare Pages app to deploy"
        required: true
        type: choice
        options:
          - customer
          - business

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-web-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [customer, business]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Enable Corepack
        run: corepack enable

      - name: Build customer web app
        if: matrix.app == 'customer' && (github.event_name == 'push' || inputs.app == 'customer')
        run: bash scripts/cloudflare-build-web-app.sh customer

      - name: Build business web app
        if: matrix.app == 'business' && (github.event_name == 'push' || inputs.app == 'business')
        run: bash scripts/cloudflare-build-web-app.sh business

      - name: Ensure customer Pages project
        if: matrix.app == 'customer' && (github.event_name == 'push' || inputs.app == 'customer')
        run: npx wrangler pages project create itunda-app --production-branch agent/itunda-agent-network || true

      - name: Deploy customer web app
        if: matrix.app == 'customer' && (github.event_name == 'push' || inputs.app == 'customer')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy services/micro-frontends/host-app/dist --project-name=itunda-app --branch=agent/itunda-agent-network --commit-message="Deploy customer web app"

      - name: Ensure business Pages project
        if: matrix.app == 'business' && (github.event_name == 'push' || inputs.app == 'business')
        run: npx wrangler pages project create itunda-business-app --production-branch agent/itunda-agent-network || true

      - name: Deploy business web app
        if: matrix.app == 'business' && (github.event_name == 'push' || inputs.app == 'business')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy services/micro-frontends/merchant-mfe/dist --project-name=itunda-business-app --branch=agent/itunda-agent-network --commit-message="Deploy business web app"
