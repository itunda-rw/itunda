name: GitHub Hosted Runner Check

on:
  push:
    branches:
      - agent/itunda-agent-network
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify hosted runner
        run: |
          echo "GitHub-hosted runner is available"
          echo "OS: $(uname -a)"
          echo "Node: $(node --version)"
          echo "Runner: $RUNNER_NAME"
