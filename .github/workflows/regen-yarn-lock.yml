name: Regenerate Yarn lockfile

on:
  push:
    branches: [main]
    paths:
      - ".yarnrc.yml"
      - "package.json"
      - "packages/**/package.json"
      - "services/**/package.json"
      - ".github/workflows/regen-yarn-lock.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: corepack enable
      - run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
      - name: Commit regenerated lockfile and remove helper
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "No lockfile changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "chore(monorepo): regenerate yarn lockfile"
            git push
          fi
