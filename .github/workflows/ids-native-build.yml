name: IDS Native Build Verification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/itunda-agent-network

permissions:
  contents: read

# Production IDS verification is native-first:
# Android -> Kotlin/Compose via Gradle
# iOS -> Swift/SwiftUI via Tuist -> Xcode -> Limrun simulator
# Expo Go, Expo Snack and EAS are not verification evidence.

jobs:
  android:
    name: Android IDS native build + install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify native production boundary
        run: bash ./scripts/verify-native-boundary.sh
      - name: Require Limrun credentials
        run: |
          if [ -z "$LIM_API_KEY" ]; then
            echo "::error::LIM_API_KEY repository secret is required for native Android verification."
            exit 1
          fi
      - name: Install Limrun CLI
        run: npm install --global lim
      - name: Build native Android app on Limrun
        run: lim gradle build . --project-path android --upload itunda-native-android.apk
      - name: Install native Android artifact on Limrun emulator
        run: lim android create --install-asset=itunda-native-android.apk
      - name: Capture native Android verification manifest
        run: |
          cat > android-native-verification.txt <<EOF
          commit=${GITHUB_SHA}
          lane=limrun-gradle
          project=android
          artifact=itunda-native-android.apk
          status=build-and-install-complete
          expo_evidence=false
          EOF
      - name: Upload Android verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: ids-native-android-verification
          path: android-native-verification.txt
          retention-days: 14

  ios:
    name: iOS IDS native Xcode build + install
    # Tuist requires macOS/Xcode to turn Project.swift into the native project.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify native production boundary
        run: bash ./scripts/verify-native-boundary.sh
      - name: Require Limrun credentials
        run: |
          if [ -z "$LIM_API_KEY" ]; then
            echo "::error::LIM_API_KEY repository secret is required for native iOS verification."
            exit 1
          fi
      - name: Install Tuist
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Generate native Xcode project from Tuist manifest
        working-directory: ios
        run: |
          mise use --pin tuist@latest
          tuist generate --no-open
      - name: Install Limrun CLI
        run: npm install --global lim
      - name: Create and attach native iOS simulator
        run: lim ios create --attach --no-open
      - name: Build and install native iOS IDS host on Limrun
        run: lim xcode build . --scheme ItundaRiderApp --configuration Debug --include '^ios/.*\.xcodeproj/'
      - name: Verify native iOS build logs
        run: lim xcode logs
      - name: Capture native iOS verification manifest
        run: |
          cat > ios-native-verification.txt <<EOF
          commit=${GITHUB_SHA}
          lane=limrun-xcode
          scheme=ItundaRiderApp
          configuration=Debug
          project_generation=tuist
          status=build-and-install-complete
          expo_evidence=false
          EOF
      - name: Upload iOS verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: ids-native-ios-verification
          path: ios-native-verification.txt
          retention-days: 14
