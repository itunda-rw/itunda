name: IDS Native Build Verification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/itunda-agent-network

permissions:
  contents: read

jobs:
  android:
    name: Android IDS native compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: packages/saronite/package-lock.json
      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Itunda Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: ids-native-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS IDS remote Xcode verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIM_API_KEY: ${{ secrets.LIM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require Limrun credentials
        run: |
          if [ -z "$LIM_API_KEY" ]; then
            echo "::error::LIM_API_KEY repository secret is required for remote iOS native verification."
            echo "GitHub-hosted macOS runners are unavailable on GHE.com subdomains."
            exit 1
          fi
      - name: Install Limrun CLI
        run: npm install --global lim
      - name: Build iOS IDS host remotely
        run: |
          lim xcode build . \
            --scheme ItundaRiderApp \
            --configuration Debug
      - name: Attach remote iOS simulator
        run: lim ios create --attach --no-open
      - name: Verify remote Xcode build completed
        run: lim xcode logs
      - name: Upload native verification manifest
        run: |
          cat > ios-native-verification.txt <<EOF
          commit=${GITHUB_SHA}
          lane=limrun-xcode
          scheme=ItundaRiderApp
          configuration=Debug
          status=build-complete
          EOF
      - name: Upload iOS verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: ids-native-ios-verification
          path: ios-native-verification.txt
          retention-days: 14
