name: IDS semantic parity

on:
  # Hosted runners are unavailable for the current Enterprise trial; run manually until entitlement is restored.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check IDS semantic parity
        run: node scripts/design-system-parity.mjs
