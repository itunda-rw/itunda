name: IDS semantic parity

on:
  push:
    branches:
      - main
    paths:
      - "client/design-system/**"
      - "android/core/designsystem/src/main/java/rw/itunda/core/designsystem/theme/IdsSemanticColors.kt"
      - "ios/Core/DesignSystem/Sources/IDS.swift"
      - "packages/design-tokens/brand-themes.json"
      - "scripts/design-system-parity.mjs"
      - ".github/workflows/ids-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check IDS semantic parity
        run: node scripts/design-system-parity.mjs
