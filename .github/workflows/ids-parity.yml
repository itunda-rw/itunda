name: IDS semantic parity

on:
  push:
    branches: [agent/itunda-agent-network]
    paths:
      - "client/design-system/**"
      - "android/core/designsystem/**"
      - "ios/Core/DesignSystem/**"
      - "scripts/design-system-parity.mjs"
      - ".github/workflows/ids-parity.yml"
  pull_request:
    paths:
      - "client/design-system/**"
      - "android/core/designsystem/**"
      - "ios/Core/DesignSystem/**"
      - "scripts/design-system-parity.mjs"
      - ".github/workflows/ids-parity.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check IDS semantic parity
        run: node scripts/design-system-parity.mjs
