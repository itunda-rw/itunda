name: Deploy Itunda site and blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/blog/package-lock.json

      - name: Build blog
        working-directory: services/blog
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        run: |
          rm -rf /tmp/itunda-pages
          mkdir -p /tmp/itunda-pages/blog
          cp -R site/. /tmp/itunda-pages/
          cp -R services/blog/dist/. /tmp/itunda-pages/blog/
          touch /tmp/itunda-pages/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/itunda-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
