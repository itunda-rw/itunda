name: Deploy Itunda site and blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    name: Build main site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package main site
        run: |
          rm -rf /tmp/site
          mkdir -p /tmp/site
          cp -R site/. /tmp/site/
          touch /tmp/site/.nojekyll

      - name: Upload main site build
        uses: actions/upload-artifact@v4
        with:
          name: itunda-site
          path: /tmp/site
          if-no-files-found: error

  build-blog:
    name: Build itunda Tech independently
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/blog/package-lock.json

      - name: Install blog dependencies
        working-directory: services/blog
        run: npm ci

      - name: Build itunda Tech
        working-directory: services/blog
        run: npm run build

      - name: Upload blog build
        uses: actions/upload-artifact@v4
        with:
          name: itunda-tech-blog
          path: services/blog/dist
          if-no-files-found: error

  publish:
    name: Publish combined Pages site
    needs: [build-site, build-blog]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download main site
        uses: actions/download-artifact@v4
        with:
          name: itunda-site
          path: /tmp/itunda-pages

      - name: Download itunda Tech
        uses: actions/download-artifact@v4
        with:
          name: itunda-tech-blog
          path: /tmp/itunda-pages/blog

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/itunda-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
