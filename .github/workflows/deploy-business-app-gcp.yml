name: Deploy Itunda Business App to Google Cloud

on:
  push:
    branches:
      - agent/itunda-agent-network
    paths:
      - "services/micro-frontends/merchant-mfe/**"
      - "services/micro-frontends/nginx.conf"
      - "services/micro-frontends/Dockerfile.business-gcp"
      - "services/micro-frontends/Dockerfile.dockerignore"
      - "packages/design-system-web/**"
      - "packages/design-tokens/**"
      - "yarn.lock"
      - ".github/workflows/deploy-business-app-gcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'itunda-org' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'itunda' }}
  SERVICE_NAME: itunda-business-app
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || 'itunda-api@itunda-org.iam.gserviceaccount.com' }}
  API_BASE_URL: https://itunda-api-hptgu43hsa-du.a.run.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Business app image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/itunda-business-app:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          cp services/micro-frontends/Dockerfile.dockerignore .dockerignore
          docker build --build-arg VITE_API_BASE_URL="${API_BASE_URL}" -f services/micro-frontends/Dockerfile.business-gcp -t "${IMAGE}" .

      - name: Push Business app image
        run: docker push "${IMAGE}"

      - name: Deploy Business app to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --platform=managed \
            --port=80 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --quiet

      - name: Verify Business app
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" --region="${REGION}" --project="${PROJECT_ID}" --format="value(status.url)")"
          curl --fail --silent --show-error --location --max-time 30 "${URL}/" > /tmp/business.html
          test -s /tmp/business.html
          grep -Eiq '<(html|body|div|main|script)[ >]' /tmp/business.html
          echo "Business app is live at ${URL}"
