name: IDS semantic parity

on:
  pull_request:
    paths:
      - "client/design-system/**"
      - "android/core/designsystem/**"
      - "ios/Core/DesignSystem/**"
      - "scripts/design-system-parity.mjs"
      - ".github/workflows/ids-semantic-parity.yml"
  push:
    branches: [main]
    paths:
      - "client/design-system/**"
      - "android/core/designsystem/**"
      - "ios/Core/DesignSystem/**"
      - "scripts/design-system-parity.mjs"
      - ".github/workflows/ids-semantic-parity.yml"

permissions:
  contents: read

jobs:
  semantic-parity:
    name: Check Web / Android / iOS semantic token contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate semantic roles and brand anchors
        run: node scripts/design-system-parity.mjs
