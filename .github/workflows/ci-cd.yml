name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Root Yarn workspace: packages/shared-utils, services/micro-frontends/*, services/api-gateway
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Real CI fix (2026-09-03): package.json pins "packageManager": "yarn@4.17.0"
      # (Corepack-managed), but the runner's global Yarn is 1.22.22 -- without this,
      # `yarn install --immutable` fails immediately with "Corepack must currently be
      # enabled". Same fix needed in root-workspace-build/api-gateway-test below,
      # every job that runs a root yarn install.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn tsc --noEmit

      - name: Silo boundary check (dependency-cruiser)
        run: yarn depcruise

      - name: Silo boundary check (iOS Feature imports)
        run: python3 scripts/ios-silo-boundary-check.py

      - name: Accessibility lint (item 247, docs/DESIGN_REFERENCES.md Section 14)
        run: python3 scripts/accessibility-lint.py

      - name: File-size guardrail (no new "everything in one file" monoliths)
        run: python3 scripts/file-size-lint.py

      - name: Map category parity (backend MapPlaceCategory vs. bank-mfe/Android/iOS's hand-maintained copies)
        run: python3 scripts/verify-map-category-parity.py

  root-workspace-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build host-app
        run: yarn build

  api-gateway-test:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test API gateway resilience behavior
        run: yarn workspace @itunda/api-gateway test

  # The private-cloud image builder intentionally refuses to build while the
  # single-node cluster is short on memory. Build every production container
  # in CI too, so Dockerfile/package changes are verified before a later
  # progressive rollout builds and publishes the private-registry images.
  application-container-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: services/api-gateway
          - name: backend
            dockerfile: services/backend/Dockerfile
            context: services/backend
          - name: ledger-service
            dockerfile: services/microservices/ledger-service/Dockerfile
            context: services/microservices
          - name: payment-service
            dockerfile: services/microservices/payment-service/Dockerfile
            context: services/microservices
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} container
        run: docker build --tag itunda/${{ matrix.name }}:ci --file ${{ matrix.dockerfile }} ${{ matrix.context }}

  progressive-manifest-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify progressive rollout image pins
        run: bash scripts/verify-progressive-images.sh

      - name: Verify API gateway runtime security controls
        run: bash scripts/verify-api-gateway-runtime-security.sh

  backend-migration-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Flyway migration versions
        run: bash scripts/verify-flyway-migrations.sh

      - name: Verify every LedgerLeg accountId has a matching LedgerAccount seed row
        run: python3 scripts/verify-ledger-account-seeds.py

  # services/backend: the canonical Kotlin/Spring Boot backend (auth, wallet, ledger,
  # savings, stocks, loans, insurance, bills, notifications, discover, contacts, system)
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Real CI fix (2026-09-03): root build.gradle.kts pins `jvmTarget = "17"` for
      # Kotlin compilation, but nothing pins compileJava's target -- it just uses
      # whatever JDK is active. JDK 21 here caused "Inconsistent JVM-target
      # compatibility detected for tasks 'compileJava' (21) and 'compileKotlin' (17)"
      # on every CI run. 17 matches the project's own pin (and android-build's own
      # JDK setup below), not an arbitrary downgrade.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        working-directory: services/backend
        run: ./gradlew build --no-daemon

  # services/microservices: the independently-deployable ledger-service + payment-service
  microservices-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: services/microservices
        run: ./gradlew build --no-daemon

  # android/: native Kotlin/Compose app (verified compiling and running on-device --
  # see docs/ARCHITECTURE.md §3).
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Real CI fix (2026-09-03): android/settings.gradle.kts applies the
      # `com.facebook.react.settings` plugin from
      # packages/saronite/node_modules/@react-native/gradle-plugin -- without
      # installing Saronite's JS deps first, Gradle fails at settings-evaluation
      # time with "does not exist" before a single Kotlin file compiles. Same step
      # ios-build already has below; android-build was just missing it.
      - name: Install Saronite JS dependencies (own npm workspace, not the root yarn workspace)
        working-directory: packages/saronite
        run: npm ci

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Silo boundary check (Konsist architecture test)
        working-directory: android
        run: ./gradlew :architecture-test:test --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

  # ios/: Tuist-generated Xcode project (real Feature/Interface/Testing microfeature
  # split, see docs/MULTI_AGENT_ISOLATION.md) + CocoaPods-integrated React Native
  # bridge for the Saronite mini-app host. Verified building locally 2026-07-23 (the
  # `Target(...)` manifest calls needed updating to Tuist's current
  # `Target.target(destinations:...)` API, and `pod install` must run after
  # `tuist generate` -- see ios/Podfile's own comment) -- this is the first time
  # that's been a real, run green check instead of an untested claim.
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Saronite JS dependencies (own npm workspace, not the root yarn workspace)
        working-directory: packages/saronite
        run: npm ci

      # Real CI fix (2026-09-03): ios/.brick/ (BrickCodegen's own podspec + generated
      # bridge sources) is gitignored, regenerated from each mini-app's *.brick.ts spec
      # -- a fresh CI checkout never has it, so `pod install` below failed with "No
      # podspec found for BrickCodegen in .brick". Same command the Podfile's own
      # BrickCodegen doc comment already documents for local regeneration.
      - name: Generate BrickCodegen iOS bridge
        working-directory: packages/saronite/host-app
        run: node ../node_modules/.bin/brick-codegen --platform ios --output-ios ../../../ios/.brick --projectRoot .

      - name: Install Tuist
        run: brew install --cask tuist

      - name: Generate Xcode project
        working-directory: ios
        run: tuist generate --no-open

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build ItundaApp
        working-directory: ios
        run: |
          xcodebuild -workspace Itunda.xcworkspace -scheme ItundaApp \
            -destination 'generic/platform=iOS Simulator' build \
            CODE_SIGNING_ALLOWED=NO
