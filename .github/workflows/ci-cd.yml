name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Root Yarn workspace: packages/shared-utils, services/micro-frontends/*, services/api-gateway
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn tsc --noEmit

  root-workspace-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build host-app
        run: yarn build

  # services/backend: the canonical Kotlin/Spring Boot backend (auth, wallet, ledger,
  # savings, stocks, loans, insurance, bills, notifications, discover, contacts, system)
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: services/backend
        run: ./gradlew build --no-daemon

  # services/microservices: the independently-deployable ledger-service + payment-service
  microservices-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: services/microservices
        run: ./gradlew build --no-daemon

  # android/: native Kotlin/Compose app (verified compiling and running on-device --
  # see docs/ARCHITECTURE.md §3). iOS/Tuist needs a macOS runner and isn't build-verified
  # yet even locally, so it isn't in CI as another green check that isn't real.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
