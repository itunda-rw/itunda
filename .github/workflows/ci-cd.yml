name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Root Yarn workspace: packages/shared-utils, services/micro-frontends/*, services/api-gateway
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn tsc --noEmit

      - name: Silo boundary check (dependency-cruiser)
        run: yarn depcruise

      - name: Silo boundary check (iOS Feature imports)
        run: python3 scripts/ios-silo-boundary-check.py

      - name: Accessibility lint (item 247, docs/DESIGN_REFERENCES.md Section 14)
        run: python3 scripts/accessibility-lint.py

  root-workspace-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build host-app
        run: yarn build

  api-gateway-test:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test API gateway resilience behavior
        run: yarn workspace @itunda/api-gateway test

  # The private-cloud image builder intentionally refuses to build while the
  # single-node cluster is short on memory. Build every production container
  # in CI too, so Dockerfile/package changes are verified before a later
  # progressive rollout builds and publishes the private-registry images.
  application-container-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: services/api-gateway
          - name: backend
            dockerfile: services/backend/Dockerfile
            context: services/backend
          - name: ledger-service
            dockerfile: services/microservices/ledger-service/Dockerfile
            context: services/microservices
          - name: payment-service
            dockerfile: services/microservices/payment-service/Dockerfile
            context: services/microservices
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} container
        run: docker build --tag itunda/${{ matrix.name }}:ci --file ${{ matrix.dockerfile }} ${{ matrix.context }}

  progressive-manifest-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify progressive rollout image pins
        run: bash scripts/verify-progressive-images.sh

      - name: Verify API gateway runtime security controls
        run: bash scripts/verify-api-gateway-runtime-security.sh

  backend-migration-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Flyway migration versions
        run: bash scripts/verify-flyway-migrations.sh

  # services/backend: the canonical Kotlin/Spring Boot backend (auth, wallet, ledger,
  # savings, stocks, loans, insurance, bills, notifications, discover, contacts, system)
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: services/backend
        run: ./gradlew build --no-daemon

  # services/microservices: the independently-deployable ledger-service + payment-service
  microservices-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: services/microservices
        run: ./gradlew build --no-daemon

  # android/: native Kotlin/Compose app (verified compiling and running on-device --
  # see docs/ARCHITECTURE.md §3).
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Silo boundary check (Konsist architecture test)
        working-directory: android
        run: ./gradlew :architecture-test:test --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

  # ios/: Tuist-generated Xcode project (real Feature/Interface/Testing microfeature
  # split, see docs/MULTI_AGENT_ISOLATION.md) + CocoaPods-integrated React Native
  # bridge for the Saronite mini-app host. Verified building locally 2026-07-23 (the
  # `Target(...)` manifest calls needed updating to Tuist's current
  # `Target.target(destinations:...)` API, and `pod install` must run after
  # `tuist generate` -- see ios/Podfile's own comment) -- this is the first time
  # that's been a real, run green check instead of an untested claim.
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Saronite JS dependencies (own npm workspace, not the root yarn workspace)
        working-directory: packages/saronite
        run: npm ci

      - name: Install Tuist
        run: brew install --cask tuist

      - name: Generate Xcode project
        working-directory: ios
        run: tuist generate --no-open

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build ItundaApp
        working-directory: ios
        run: |
          xcodebuild -workspace Itunda.xcworkspace -scheme ItundaApp \
            -destination 'generic/platform=iOS Simulator' build \
            CODE_SIGNING_ALLOWED=NO
