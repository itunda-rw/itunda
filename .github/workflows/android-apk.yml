name: Itunda Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/android-map-preview-fallback"
    paths:
      - "android/**"
      - "packages/saronite/**"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-pr.yml"

permissions:
  contents: read

jobs:
  build_android_apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: yarn install --no-immutable

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure CI Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2048m" >> ~/.gradle/gradle.properties

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itunda-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
