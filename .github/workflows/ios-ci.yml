name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Standard Intel lane; larger macOS runners require Team/Enterprise.
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # Do not use setup-node's Yarn cache here: it invokes global Yarn before Corepack is enabled.
          package-manager-cache: false

      - name: Cache macOS native build state
        uses: actions/cache@v4
        with:
          path: |
            ios/.ci-derived-data
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cache/tuist
            ~/.local/share/mise
          key: ios-native-macos15-${{ hashFiles('ios/Podfile.lock', 'ios/Project.swift', 'packages/saronite/package.json', 'packages/saronite/package-lock.json') }}
          restore-keys: |
            ios-native-macos15-

      - name: Enable Corepack
        run: corepack enable

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: yarn install --no-immutable --no-audit --no-fund

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Saronite iOS Brick codegen
        working-directory: packages/saronite/host-app
        run: |
          rm -rf ../../../ios/.brick
          node ../node_modules/.bin/brick-codegen             --platform ios             --output-ios ../../../ios/.brick             --projectRoot .

      - name: Install Tuist 3.42.3
        run: |
          mise install tuist@3.42.3
          mise exec tuist@3.42.3 -- tuist version

      # Brand assets are consumed from the canonical package.
      # Do not rasterize, regenerate, recolor, or rewrite the supplied SVGs in CI.
      - name: Verify canonical iOS brand source
        run: |
          set -euo pipefail
          test -s packages/brand-assets/canonical/itunda-brand/app-icons/itunda-app-icon.svg
          test -s packages/brand-assets/canonical/itunda-brand/app-icons/itunda-ios-dark.svg
          test -s packages/brand-assets/canonical/itunda-brand/app-icons/itunda-ios-tinted.svg
          test -s packages/brand-assets/canonical/itunda-brand/symbol/itunda-symbol.svg

      - name: Generate Xcode project
        working-directory: ios
        run: |
          mise exec tuist@3.42.3 -- tuist generate --no-open

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --deployment

      - name: Build iOS simulator app
        working-directory: ios
        run: |
          xcodebuild -workspace Itunda.xcworkspace -scheme ItundaApp -destination 'generic/platform=iOS Simulator' -derivedDataPath .ci-derived-data -parallelizeTargets -jobs 4 CODE_SIGNING_ALLOWED=NO build

      - name: Run iOS UI tests
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone Simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -workspace Itunda.xcworkspace -scheme ItundaApp -destination "id=$DEVICE_ID" -derivedDataPath .ci-derived-data CODE_SIGNING_ALLOWED=NO test
