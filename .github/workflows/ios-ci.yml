name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/saronite/package.json

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: npm install

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Tuist 3.42.3
        run: |
          mise install tuist@3.42.3
          mise exec tuist@3.42.3 -- tuist version

      # Keep icon generation isolated from the runner's externally-managed Python.
      # The source SVG lives under ios/Assets; App/Resources contains only generated XCAssets.
      - name: Generate iOS app icon asset catalog
        working-directory: ios
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check cairosvg pillow
          .ci-venv/bin/python <<'PY'
          import cairosvg
          from pathlib import Path

          src = Path("Assets/ItundaIcon.svg")
          out = Path("App/Resources/ItundaIcon.xcassets/ItundaIcon.appiconset/ItundaIcon.png")
          out.parent.mkdir(parents=True, exist_ok=True)

          cairosvg.svg2png(
              url=str(src),
              write_to=str(out),
              output_width=1024,
              output_height=1024,
          )
          PY
          cat > App/Resources/ItundaIcon.xcassets/ItundaIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "ItundaIcon.png",
                "idiom": "universal",
                "scale": "1x",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "Itunda",
              "version": 1
            }
          }
          JSON

      - name: Generate Xcode project
        working-directory: ios
        run: |
          mise exec tuist@3.42.3 -- tuist generate --no-open

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS simulator app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Itunda.xcworkspace \
            -scheme ItundaApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
