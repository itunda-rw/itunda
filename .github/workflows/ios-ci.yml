name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/saronite/package.json

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: npm install

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Tuist 3.42.3
        run: |
          mise install tuist@3.42.3
          mise exec tuist@3.42.3 -- tuist version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          mise exec tuist@3.42.3 -- tuist generate --no-open

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS simulator app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Itunda.xcworkspace \
            -scheme ItundaApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
