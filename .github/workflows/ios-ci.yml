name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Standard Intel lane; larger macOS runners require Team/Enterprise.
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/saronite/package.json

      - name: Cache macOS native build state
        uses: actions/cache@v4
        with:
          path: |
            ios/.ci-derived-data
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cache/tuist
            ~/.local/share/mise
          key: ios-native-macos15-${{ hashFiles('ios/Podfile.lock', 'ios/Project.swift', 'packages/saronite/package.json', 'packages/saronite/package-lock.json') }}
          restore-keys: |
            ios-native-macos15-

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: npm install --no-audit --no-fund

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Saronite iOS Brick codegen
        working-directory: packages/saronite/host-app
        run: |
          rm -rf ../../../ios/.brick
          node ../node_modules/.bin/brick-codegen             --platform ios             --output-ios ../../../ios/.brick             --projectRoot .

      - name: Install Tuist
        run: |
          brew install --cask tuist
          tuist version

      # Keep icon generation isolated from the runner's externally-managed Python.
      # The source SVG lives under ios/Assets; App/Resources contains only generated XCAssets.
      - name: Generate Xcode project
        working-directory: ios
        run: |
          tuist generate --no-open

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --no-repo-update

      # The Saronite PR gate validates the native host directly. The full
      # React Native application is intentionally kept out of this gate:
      # the Intel runner is a 4-CPU/14-GB standard runner and the full app
      # repeatedly stalled while compiling third-party React Native targets.
      - name: Build Saronite iOS host
        working-directory: ios
        run: |
          xcodebuild             -project Itunda.xcodeproj             -target CoreSaronite             -sdk iphonesimulator             -configuration Debug             -derivedDataPath .ci-derived-data             CODE_SIGNING_ALLOWED=NO             build

      - name: Verify Saronite iOS artifact
        working-directory: ios
        run: |
          set -euo pipefail
          test -d ".ci-derived-data/Build/Products/Debug-iphonesimulator/CoreSaronite.framework"
          test -f ".ci-derived-data/Build/Products/Debug-iphonesimulator/CoreSaronite.framework/CoreSaronite"
          file ".ci-derived-data/Build/Products/Debug-iphonesimulator/CoreSaronite.framework/CoreSaronite"
