name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# CI trigger: keep the workflow path-sensitive while allowing PR synchronization to start a fresh run.
concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/saronite/package-lock.json

      - name: Cache Saronite node_modules
        uses: actions/cache@v4
        with:
          path: packages/saronite/node_modules
          key: ios-saronite-node-modules-${{ runner.os }}-${{ hashFiles('packages/saronite/package-lock.json') }}
          restore-keys: |
            ios-saronite-node-modules-${{ runner.os }}-

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache CocoaPods and Xcode build products
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ios-build-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'ios/Project.swift', 'packages/saronite/package-lock.json') }}
          restore-keys: |
            ios-build-${{ runner.os }}-

      - name: Install mise
        run: |
          curl --fail --retry 5 --retry-delay 2 --retry-all-errors https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Saronite iOS Brick codegen
        working-directory: packages/saronite/host-app
        run: |
          rm -rf ../../../ios/.brick
          node ../node_modules/.bin/brick-codegen --platform ios --output-ios ../../../ios/.brick --projectRoot .

      - name: Install Tuist 4.205.0
        run: |
          mise install tuist@4.205.0
          mise exec tuist@4.205.0 -- tuist version

      - name: Generate iOS app icon asset catalog
        working-directory: ios
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check cairosvg pillow
          .ci-venv/bin/python <<'PY'
          import cairosvg
          from pathlib import Path
          src = Path("Assets/ItundaIcon.svg")
          out = Path("App/Resources/ItundaIcon.xcassets/ItundaIcon.appiconset/ItundaIcon.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          cairosvg.svg2png(url=str(src), write_to=str(out), output_width=1024, output_height=1024)
          PY
          cat > App/Resources/ItundaIcon.xcassets/ItundaIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"ItundaIcon.png","idiom":"universal","scale":"1x","size":"1024x1024"}],"info":{"author":"Itunda","version":1}}
          JSON

      - name: Generate Xcode project
        working-directory: ios
        run: mise exec tuist@4.205.0 -- tuist generate --no-open

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build for testing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild             -workspace Itunda.xcworkspace             -scheme ItundaApp             -destination 'generic/platform=iOS Simulator'             -derivedDataPath "$RUNNER_TEMP/ItundaDerivedData"             -parallelizeTargets             CODE_SIGNING_ALLOWED=NO             build-for-testing

      - name: Cache build-for-testing products
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/ItundaDerivedData
            ${{ github.workspace }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-test-products-${{ github.sha }}

  ios-ui-tests:
    needs: ios-build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/saronite/package-lock.json

      - name: Cache Saronite node_modules
        uses: actions/cache@v4
        with:
          path: packages/saronite/node_modules
          key: ios-saronite-node-modules-${{ runner.os }}-${{ hashFiles('packages/saronite/package-lock.json') }}
          restore-keys: |
            ios-saronite-node-modules-${{ runner.os }}-

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install mise
        run: |
          curl --fail --retry 5 --retry-delay 2 --retry-all-errors https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mise install tuist@4.205.0

      - name: Generate Saronite iOS Brick codegen
        working-directory: packages/saronite/host-app
        run: |
          rm -rf ../../../ios/.brick
          node ../node_modules/.bin/brick-codegen --platform ios --output-ios ../../../ios/.brick --projectRoot .

      - name: Generate Xcode project
        working-directory: ios
        run: mise exec tuist@4.205.0 -- tuist generate --no-open

      - name: Restore CocoaPods and Xcode cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ios-build-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'ios/Project.swift', 'packages/saronite/package-lock.json') }}
          restore-keys: |
            ios-build-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Restore build-for-testing products
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/ItundaDerivedData
            ${{ github.workspace }}/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-test-products-${{ github.sha }}

      - name: Run iOS UI tests without rebuilding
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone Simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild             -workspace Itunda.xcworkspace             -scheme ItundaApp             -destination "id=$DEVICE_ID"             -derivedDataPath "$RUNNER_TEMP/ItundaDerivedData"             CODE_SIGNING_ALLOWED=NO             test-without-building
