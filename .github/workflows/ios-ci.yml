name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/saronite/package.json

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: npm install

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Saronite iOS Brick codegen
        working-directory: packages/saronite/host-app
        run: |
          rm -rf ../../../ios/.brick
          node ../node_modules/.bin/brick-codegen             --platform ios             --output-ios ../../../ios/.brick             --projectRoot .

      - name: Install Tuist 4.205.0
        run: |
          mise install tuist@4.205.0
          mise exec tuist@4.205.0 -- tuist version

      # Keep icon generation isolated from the runner's externally-managed Python.
      # The source SVG lives under ios/Assets; App/Resources contains only generated XCAssets.
      - name: Generate iOS app icon asset catalog
        working-directory: ios
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check cairosvg pillow
          .ci-venv/bin/python <<'PY'
          import cairosvg
          from pathlib import Path

          src = Path("Assets/ItundaIcon.svg")
          out = Path("App/Resources/ItundaIcon.xcassets/ItundaIcon.appiconset/ItundaIcon.png")
          out.parent.mkdir(parents=True, exist_ok=True)

          cairosvg.svg2png(
              url=str(src),
              write_to=str(out),
              output_width=1024,
              output_height=1024,
          )
          PY
          cat > App/Resources/ItundaIcon.xcassets/ItundaIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "ItundaIcon.png",
                "idiom": "universal",
                "scale": "1x",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "Itunda",
              "version": 1
            }
          }
          JSON

      - name: Generate Xcode project
        working-directory: ios
        run: |
          mise exec tuist@4.205.0 -- tuist generate --no-open

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS simulator app
        working-directory: ios
        run: |
          xcodebuild             -workspace Itunda.xcworkspace             -scheme ItundaApp             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Start iOS UI test infrastructure
        run: |
          docker compose -f infra/docker-compose.yml up -d mysql redis-node-1 kafka-broker-1 zookeeper debezium

      - name: Start real backend for iOS UI tests
        working-directory: services/backend
        env:
          DB_PORT: "3307"
          REDIS_PORT: "16379"
          KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
        run: |
          ./gradlew :app:bootRun > /tmp/itunda-backend.log 2>&1 &
          BACKEND_PID=$!
          echo "$BACKEND_PID" > /tmp/itunda-backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4001/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "Backend exited before becoming healthy"
              cat /tmp/itunda-backend.log
              exit 1
            fi
            sleep 2
          done
          echo "Backend did not become healthy within 120 seconds"
          cat /tmp/itunda-backend.log
          exit 1

      - name: Run iOS UI tests
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone Simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild \
            -workspace Itunda.xcworkspace \
            -scheme ItundaApp \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
