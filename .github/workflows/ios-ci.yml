name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "packages/saronite/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/saronite/package.json

      - name: Install Saronite dependencies
        working-directory: packages/saronite
        run: npm install

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Saronite iOS Brick codegen
        working-directory: packages/saronite/host-app
        run: |
          rm -rf ../../../ios/.brick
          node ../node_modules/.bin/brick-codegen             --platform ios             --output-ios ../../../ios/.brick             --projectRoot .

      - name: Install Tuist 4.205.0
        run: |
          mise install tuist@4.205.0
          mise exec tuist@4.205.0 -- tuist version

      # Keep icon generation isolated from the runner's externally-managed Python.
      # The source SVG lives under ios/Assets; App/Resources contains only generated XCAssets.
      - name: Generate iOS app icon asset catalog
        working-directory: ios
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check cairosvg pillow
          .ci-venv/bin/python <<'PY'
          import cairosvg
          from pathlib import Path

          src = Path("Assets/ItundaIcon.svg")
          out = Path("App/Resources/ItundaIcon.xcassets/ItundaIcon.appiconset/ItundaIcon.png")
          out.parent.mkdir(parents=True, exist_ok=True)

          cairosvg.svg2png(
              url=str(src),
              write_to=str(out),
              output_width=1024,
              output_height=1024,
          )
          PY
          cat > App/Resources/ItundaIcon.xcassets/ItundaIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "ItundaIcon.png",
                "idiom": "universal",
                "scale": "1x",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "Itunda",
              "version": 1
            }
          }
          JSON

      - name: Generate Xcode project
        working-directory: ios
        run: |
          mise exec tuist@4.205.0 -- tuist generate --no-open

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS simulator app
        working-directory: ios
        run: |
          xcodebuild             -workspace Itunda.xcworkspace             -scheme ItundaApp             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Start iOS UI test infrastructure
        run: |
          docker compose -f infra/docker-compose.yml up -d mysql redis-node-1 kafka-broker-1 zookeeper debezium

      - name: Start real backend for iOS UI tests
        working-directory: services/backend
        env:
          DB_PORT: "3307"
          REDIS_PORT: "16379"
          KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
        run: |
          ./gradlew :app:bootRun > /tmp/itunda-backend.log 2>&1 &
          BACKEND_PID=$!
          echo "$BACKEND_PID" > /tmp/itunda-backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4001/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "Backend exited before becoming healthy"
              cat /tmp/itunda-backend.log
              exit 1
            fi
            sleep 2
          done
          echo "Backend did not become healthy within 120 seconds"
          cat /tmp/itunda-backend.log
          exit 1

      - name: Start real backend for iOS UI tests
        working-directory: services/backend
        run: |
          set -euo pipefail
          brew install mysql@8.0 redis || true
          echo "$(brew --prefix mysql@8.0)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix redis)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix mysql@8.0)/bin:$(brew --prefix redis)/bin:$PATH"
          brew services start mysql@8.0 || true
          brew services start redis || true
          for i in {1..60}; do
            mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1 && break
            sleep 2
          done
          mysqladmin ping -h 127.0.0.1 --silent
          redis-cli -h 127.0.0.1 ping
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS itunda; CREATE USER IF NOT EXISTS 'itunda'@'localhost' IDENTIFIED BY 'itunda_password'; GRANT ALL PRIVILEGES ON itunda.* TO 'itunda'@'localhost'; FLUSH PRIVILEGES;"
          nohup env DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME=itunda DB_USER=itunda DB_PASSWORD=itunda_password REDIS_HOST=127.0.0.1 REDIS_PORT=6379 KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092 ./gradlew :app:bootRun > /tmp/itunda-backend.log 2>&1 &
          for i in {1..180}; do
            if curl --fail --silent http://127.0.0.1:4001/health >/tmp/itunda-health.json; then
              cat /tmp/itunda-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/itunda-backend.log
          exit 1

      # Live XCUITests require the real backend on localhost:4001.
      # Keep the native build gate deterministic on a clean hosted runner; the
      # live suite remains runnable from a developer/owned macOS environment with
      # the backend started, rather than silently pretending a missing backend is
      # a UI regression.
