name: Refresh Saronite npm lockfile

on:
  push:
    branches: [agent/saronite-platform-parity]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Regenerate Saronite lockfile
        working-directory: packages/saronite
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- packages/saronite/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/saronite/package-lock.json
          git commit -m "chore(saronite): refresh npm lockfile"
          git push origin HEAD:agent/saronite-platform-parity
