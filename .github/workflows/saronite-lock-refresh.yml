name: Saronite lock refresh

on:
  push:
    branches: [agent/saronite-platform-parity]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/saronite-platform-parity
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Refresh npm lockfile
        working-directory: packages/saronite
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/saronite/package-lock.json
          git diff --cached --quiet || git commit -m "chore(saronite): refresh npm lockfile"
          git push origin HEAD:agent/saronite-platform-parity
