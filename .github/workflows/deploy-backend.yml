name: Deploy Itunda API to Google Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'itunda' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'itunda-api' }}
  SPRING_PROFILES_ACTIVE: "production"
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || 'itunda-api@itunda-org.iam.gserviceaccount.com' }}
  MYSQL_HOST: "10.79.0.3"
  REDIS_HOST: "10.103.51.123"
  KAFKA_BOOTSTRAP: "bootstrap-h5k05cv2cxjf.07b7efb6.asia-northeast3.managedkafka.s.cloud.goog:9092"
  CORS_ALLOWED_ORIGINS: "https://itunda.im,https://www.itunda.im,https://app.itunda.im,https://business.itunda.im,https://business-app.itunda.im,https://developers.itunda.im,https://tech-blog.itunda.im,https://itunda-web-hptgu43hsa-du.a.run.app"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build container
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/itunda-api:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          docker build -t "${IMAGE}" ./services/backend
      - name: Push container
        run: docker push "${IMAGE}"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --platform=managed \
            --port=4001 \
            --memory=1Gi \
            --max=10 \
            --max-instances=10 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --set-env-vars="^@^DB_HOST=${MYSQL_HOST}@DB_PORT=3306@DB_NAME=itunda@DB_USER=itunda@REDIS_HOST=${REDIS_HOST}@REDIS_PORT=6379@KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP}@ITUNDA_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}@SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}" \
            --set-secrets="^@^DB_PASSWORD=itunda-db-password:3@JWT_SECRET=itunda-jwt-secret:1" \
            --quiet
      - name: Capture service URL
        id: service
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" --region="${REGION}" --project="${PROJECT_ID}" --format="value(status.url)")"
          test -n "${URL}"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "Deployed service URL: ${URL}"
      - name: Smoke-test public health endpoint
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl --silent --show-error --fail --max-time 10 "${SERVICE_URL}/actuator/health" 2>/dev/null || true)"
            if echo "${response}" | jq -e '.status == "UP"' >/dev/null 2>&1; then
              echo "Health check passed on attempt ${attempt}: ${response}"
              exit 0
            fi
            echo "Health check attempt ${attempt}/12 did not return status UP."
            sleep 5
          done
          echo "Deployment completed, but /actuator/health did not return status UP."
          exit 1
