<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Idempotency and duplicate payment requests</title>
<desc id="desc">An abstract editorial illustration of two payment requests converging on one protected transaction path.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f3ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7472f4"/><stop offset="1" stop-color="#625fe0"/></linearGradient>
</defs>
<rect width="1600" height="900" rx="44" fill="url(#bg)"/>
<circle cx="1330" cy="150" r="180" fill="#7472f4" opacity=".08"/>
<circle cx="250" cy="760" r="220" fill="#7472f4" opacity=".06"/>
<g fill="none" stroke-linecap="round" stroke-width="22">
  <path d="M230 280H610C720 280 760 350 840 450" stroke="#c9c7ff"/>
  <path d="M230 620H610C720 620 760 550 840 450" stroke="#c9c7ff"/>
  <path d="M840 450H1320" stroke="url(#accent)"/>
</g>
<g fill="#fff" stroke="#e5e5ef" stroke-width="4">
  <rect x="120" y="205" width="330" height="150" rx="30"/>
  <rect x="120" y="545" width="330" height="150" rx="30"/>
  <rect x="690" y="340" width="300" height="220" rx="36"/>
  <rect x="1210" y="365" width="270" height="170" rx="32"/>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif" fill="#191f28">
  <text x="175" y="270" font-size="28" font-weight="700">Request A</text>
  <text x="175" y="315" font-size="22" fill="#6b7684">Idempotency-Key</text>
  <text x="175" y="370" font-size="28" font-weight="700">Request B</text>
  <text x="175" y="415" font-size="22" fill="#6b7684">same key</text>
  <text x="745" y="425" font-size="28" font-weight="800">One protected</text>
  <text x="745" y="465" font-size="28" font-weight="800">transaction</text>
  <text x="745" y="515" font-size="20" fill="#6b7684">one wins · one waits</text>
  <text x="1260" y="430" font-size="25" font-weight="800">200</text>
  <text x="1360" y="430" font-size="25" font-weight="800">409</text>
  <text x="1260" y="475" font-size="18" fill="#6b7684">safe replay</text>
</g>
<circle cx="840" cy="450" r="48" fill="#7472f4"/>
<path d="M817 450l16 16 32-36" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>