server:
  port: 4001

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

spring:
  application:
    name: itunda
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:itunda}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:itunda}
    password: ${DB_PASSWORD:itunda_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      client-type: jedis
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 120
    connect-retries-interval: 2
  task:
    scheduling:
      pool:
        size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

itunda:
  kafka:
    enabled: ${ITUNDA_KAFKA_ENABLED:false}
  providers:
    simulation-enabled: ${ITUNDA_PROVIDER_SIMULATION_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:itunda-dev-secret-do-not-use-in-production}
  ussd:
    gateway-secret: ${USSD_GATEWAY_SECRET:}
  mtn-momo:
    subscription-key: ${MTN_MOMO_SUBSCRIPTION_KEY:}
    user-id: ${MTN_MOMO_USER_ID:}
    api-key: ${MTN_MOMO_API_KEY:}
    base-url: ${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
  osrm:
    base-url: ${OSRM_BASE_URL:}
    foot-base-url: ${OSRM_FOOT_BASE_URL:}
    bike-base-url: ${OSRM_BIKE_BASE_URL:}
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:}
  ai-summary:
    base-url: ${AI_SUMMARY_BASE_URL:}
    model: ${AI_SUMMARY_MODEL:llama-3.2-1b-instruct}
  turn:
    secret: ${TURN_SECRET:}
  pay:
    checkout-base-url: ${ITUNDA_PAY_CHECKOUT_BASE_URL:http://localhost:5005}
  push:
    firebase-credentials-path: ${FCM_CREDENTIALS_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: production

itunda:
  providers:
    simulation-enabled: false
  cors:
    allowed-origins: "https://itunda.im,https://www.itunda.im,https://app.itunda.im,https://business.itunda.im,https://business-app.itunda.im,https://developers.itunda.im,https://tech-blog.itunda.im,https://itunda-app.pages.dev,https://itunda-business-app.pages.dev"
  jwt:
    secret: ${JWT_SECRET}
