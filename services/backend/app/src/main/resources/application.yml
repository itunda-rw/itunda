server:
  port: 4001

spring:
  application:
    name: itunda
  # Real photo upload (2026-07-24) -- see UploadController's own doc comment. Spring
  # Boot's own defaults (1MB file / 10MB request) are too small for a real phone photo.
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  # This app authenticates purely via the JWT filter (see SecurityConfig/
  # JwtAuthenticationFilter) and never uses Spring Security's UserDetailsService /
  # form-login machinery, so auto-configuring an in-memory default user is just noise
  # (and a red herring — that generated password authenticates nothing real).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # Defaults stay on the standard MySQL port for private-cloud/external-infra
    # deployments. The repo's optional local Docker fallback maps MySQL to 3307;
    # scripts/local-ecosystem.sh exports that override automatically in all-local
    # mode so this file doesn't need to hard-code one environment's host port.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:itunda}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:itunda}
    # Matches infra/docker-compose.yml's local MySQL default. Production and CI
    # must supply DB_PASSWORD explicitly; this value is only for the disposable
    # developer container.
    password: ${DB_PASSWORD:itunda_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # Same reasoning as the MySQL default above: standard external Redis by
      # default, local-Docker override injected by scripts/local-ecosystem.sh.
      port: ${REDIS_PORT:6379}
  # Real event backbone for ledger.posted (see core/.../events/, 2026-07-11 fix) --
  # same env var convention as services/microservices' KAFKA_BOOTSTRAP_SERVERS.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cheap insurance against real (if brief) DB-not-ready-yet races at pod
    # startup on this single-node cluster -- exactly the scenario
    # connect-retries exists for. Investigated at length during a 2026-07-24
    # crash-loop that first looked like exactly this, but wasn't: a
    # `kubectl patch --type merge` had silently wiped this container's
    # DB_HOST/DB_PORT env vars, so it was really retrying a connection to
    # `localhost` that could never succeed no matter the budget (see
    # infra/k8s/progressive-delivery/backend-rollout.yaml's own note on the
    # same incident). Kept anyway since a longer retry budget is legitimate
    # defense against the real, narrower version of this race.
    connect-retries: 120
    connect-retries-interval: 2
  task:
    scheduling:
      # Real bug found live (2026-07-13): Spring Boot's default is a single-threaded
      # scheduler pool shared by every @Scheduled bean. OutboxRelay.relay() (every 2s)
      # blocks on kafkaTemplate.send(...).get() with no timeout when Kafka is
      # unreachable, monopolizing that one thread -- the new AutoSaveScheduler
      # (savings/AutoSaveScheduler.kt) ran exactly once at boot and never again,
      # confirmed via logs showing no second execution despite the app running for
      # minutes. Every @Scheduled bean in this app was silently at risk of the same
      # starvation, not just the new one that happened to surface it.
      pool:
        size: 10
  jpa:
    hibernate:
      # Fixed (2026-07-11): was `update`, letting Hibernate infer the schema -- the
      # documented "demo stepping stone" gap this comment used to describe. Real
      # versioned migrations now live in app/src/main/resources/db/migration/, and
      # Hibernate just validates its entity mappings against what Flyway created
      # rather than being trusted to derive the schema itself.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

itunda:
  jwt:
    secret: ${JWT_SECRET:itunda-dev-secret-do-not-use-in-production}
  # Real MTN MoMo Collection sandbox integration (2026-07-17) -- see
  # MtnMomoProviderConnector.kt's own doc comment for the full account. Empty by
  # default: without real sandbox credentials (momodeveloper.mtn.com, free self-serve
  # signup), every rail -- including mtn_momo -- falls back to SimulatedProviderConnector,
  # exactly as before this integration existed. Never required for local dev/CI.
  mtn-momo:
    subscription-key: ${MTN_MOMO_SUBSCRIPTION_KEY:}
    user-id: ${MTN_MOMO_USER_ID:}
    api-key: ${MTN_MOMO_API_KEY:}
    base-url: ${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
  # Real self-hosted OSRM routing (2026-07-18) -- itunda's own Rwanda-only road network,
  # not a third-party Maps API. See OsrmRoutingClient's own doc comment and
  # docs/TOSS_PARITY_MATRIX.md's Maps row. Empty by default: without a configured
  # base-url, every caller falls back to GeoUtils.haversineKm's straight-line distance,
  # exactly as before this integration existed. Never required for local dev/CI.
  osrm:
    base-url: ${OSRM_BASE_URL:}
    # Real walking directions (2026-07-22) -- a genuinely separate OSRM instance/dataset
    # (foot.lua profile, not a request-time flag on the driving one -- see
    # OsrmRoutingClient.route's own doc comment for why). Empty by default, same
    # never-fail convention as base-url above: unconfigured falls back to the driving
    # route for a WALKING request rather than failing it.
    foot-base-url: ${OSRM_FOOT_BASE_URL:}
  # Real self-hosted Nominatim geocoding (2026-07-18) -- itunda's own Rwanda-only
  # address index, not a third-party geocoding API. See NominatimGeocodingClient's own
  # doc comment. Empty by default: without a configured base-url, a buyer's free-text
  # deliveryAddress simply doesn't resolve to coordinates and Eats falls back to its
  # original flat delivery fee, exactly as before this integration existed.
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:}
  # Real external-checkout hosted page (2026-07-21) -- see PaymentsApiController's own
  # doc comment. Where a customer's browser lands after a `requestPayment()` widget
  # call, matching Toss Payments' own hosted-checkout-page shape.
  pay:
    checkout-base-url: ${ITUNDA_PAY_CHECKOUT_BASE_URL:http://localhost:5005}

# Real Prometheus scrape target (2026-07-11, alongside micrometer-registry-prometheus
# in app/build.gradle.kts and infra/k8s/monitoring/prometheus-config.yaml's
# scrape_configs) -- only health/prometheus are exposed, not the full actuator surface.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
