server:
  port: 4001

spring:
  application:
    name: itunda
  # This app authenticates purely via the JWT filter (see SecurityConfig/
  # JwtAuthenticationFilter) and never uses Spring Security's UserDetailsService /
  # form-login machinery, so auto-configuring an in-memory default user is just noise
  # (and a red herring — that generated password authenticates nothing real).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:itunda}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:itunda}
    password: ${DB_PASSWORD:itunda}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Fixed (2026-07-11): was `update`, letting Hibernate infer the schema -- the
      # documented "demo stepping stone" gap this comment used to describe. Real
      # versioned migrations now live in app/src/main/resources/db/migration/, and
      # Hibernate just validates its entity mappings against what Flyway created
      # rather than being trusted to derive the schema itself.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

itunda:
  jwt:
    secret: ${JWT_SECRET:itunda-dev-secret-do-not-use-in-production}
