server:
  port: 4015

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

spring:
  application:
    name: itunda-loans-service
  # Same reasoning as card-service's identical exclude -- this service also
  # authenticates purely via the shared JwtAuthenticationFilter (see :security),
  # never Spring Security's UserDetailsService/form-login machinery.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # Deliberately the SAME schema :app uses (itunda), not a separate per-service
    # database -- see docs/ARCHITECTURE.md's dated follow-up for why this is safe.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:itunda}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:itunda}
    password: ${DB_PASSWORD:itunda_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Real infra RateLimiter (:auth) needs this -- same Redis instance :app
      # already points at, same env-var convention.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      # loans-service never runs migrations (flyway is disabled below and not even
      # a dependency of this module) -- :app remains the sole schema owner. This
      # only validates its own entity mappings against whatever :app's Flyway
      # migrations already created.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

itunda:
  jwt:
    # Must match :app's exact same secret -- a JWT :app minted has to validate here
    # too, see :security's SecurityConfig/JwtAuthenticationFilter (shared code, not
    # a duplicated copy).
    secret: ${JWT_SECRET:itunda-dev-secret-do-not-use-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
