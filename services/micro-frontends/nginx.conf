# Shared nginx config for every micro-frontend image built from this directory.
# CORS is enabled because Module Federation remotes may be consumed across origins.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' '*' always;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # remoteEntry.js is the Module Federation contract. Never let a browser keep
    # an old entry after a production deployment; its hashed chunks can remain
    # cached safely, but the entry itself must be revalidated.
    location ~ ^/remotes/.*/assets/remoteEntry\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
