# Shared nginx config for every micro-frontend image built from this directory's
# Dockerfile. Two real requirements beyond a plain static SPA server:
#
# 1. CORS headers on every response -- Module Federation remotes are consumed
#    cross-origin in this cluster (each micro-frontend gets its own NodePort, so
#    even same-host requests differ by port, which the browser treats as a
#    different origin). Without this, bank-mfe's browser can't fetch maps-mfe's
#    remoteEntry.js or its exposed chunks at all.
# 2. SPA fallback to index.html -- these are all client-side-routed React apps with
#    no real server-side routes of their own.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' '*' always;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
