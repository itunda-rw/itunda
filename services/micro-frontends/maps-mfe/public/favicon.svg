<!-- Real itunda mark (2026-08-22, direct user identity work): "petal" shape in
     indigo, chosen after a full 14-shape x 16-color exploration pass - see
     itunda-identity.html (project_itunda_brand_identity.md) for the full derivation.
     Indigo is not invented: same OKLCH hue-rotation Toss's own eng blog documents
     (toss.tech/article/tds-color-system-update), applied to the real itunda blue
     tokens.css's itunda-indigo token held before as blue. Replaces the previous
     unbranded default Vite placeholder favicon (an abstract purple blob), which
     was never actually updated after project scaffolding. Same mark ported to
     Android's ic_launcher_foreground.xml and iOS's AppIcon.appiconset. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="r" x1="20%" y1="0%" x2="88%" y2="95%">
      <stop offset="0%" stop-color="#c0c6ff"/>
      <stop offset="45%" stop-color="#7c7bfd"/>
      <stop offset="100%" stop-color="#483eb6"/>
    </linearGradient>
    <linearGradient id="l" x1="75%" y1="5%" x2="10%" y2="95%">
      <stop offset="0%" stop-color="#8283fe"/>
      <stop offset="50%" stop-color="#5c55d8"/>
      <stop offset="100%" stop-color="#282565"/>
    </linearGradient>
    <radialGradient id="h" cx="58%" cy="12%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#483eb6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <path d="M42,16 C74,8 94,44 56,88 C50,66 40,40 42,16 Z" fill="url(#r)"/>
    <path d="M42,16 C40,40 50,66 56,88 C24,86 8,48 42,16 Z" fill="url(#l)"/>
  </g>
  <path d="M42,16 C74,8 94,44 56,88 C50,66 40,40 42,16 Z" fill="url(#h)"/>
</svg>
