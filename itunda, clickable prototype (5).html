<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>itunda, clickable prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#191F28;--mu:#6B7684;--tt:#8B95A1;--ln:#E5E8EB;--chip:#F4F5F8;--tint:#EEEDFF;--tintfg:#5B54D6;--lk:#6960F9;--ok:#0A8F5B;--er:#D92D20;--br:#8F89FF;--on:#121216;--page:#E9EBF0}
@media (prefers-color-scheme:dark){:root{--bg:#121216;--tx:#F4F5F7;--mu:#9AA1AD;--tt:#7A818C;--ln:#2E2E37;--chip:#25252D;--tint:#2A2850;--tintfg:#B3AEFF;--lk:#8F89FF;--page:#0A0A0D}}
:root[data-theme=light]{--bg:#fff;--tx:#191F28;--mu:#6B7684;--tt:#8B95A1;--ln:#E5E8EB;--chip:#F4F5F8;--tint:#EEEDFF;--tintfg:#5B54D6;--lk:#6960F9;--page:#E9EBF0}
:root[data-theme=dark]{--bg:#121216;--tx:#F4F5F7;--mu:#9AA1AD;--tt:#7A818C;--ln:#2E2E37;--chip:#25252D;--tint:#2A2850;--tintfg:#B3AEFF;--lk:#8F89FF;--page:#0A0A0D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);display:flex;align-items:center;justify-content:center;font-family:'Pretendard','Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx)}
#phone{position:relative;width:390px;height:844px;max-height:100dvh;background:var(--bg);border-radius:36px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18)}
@media (max-width:430px){#phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0;overflow-y:auto;background:var(--bg);padding-bottom:96px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.push{animation:push .32s cubic-bezier(.2,.8,.2,1)}.pop{animation:fade .22s ease-out}.fade{animation:fade .24s ease-out}
@keyframes push{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s ease,opacity .2s}
button:active,.tap:active{transform:scale(.97)}
.pad{padding:0 24px}
.h1{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:36px}
.big{font-size:40px;font-weight:800;letter-spacing:-1.2px}
.mu{color:var(--mu)}.sm{font-size:13px}
.sec{padding:32px 24px 0}.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:18px;font-weight:800}
.sech a{font-size:14px;color:var(--lk);font-weight:700}
.row{display:flex;align-items:center;gap:14px;padding:11px 0;cursor:pointer}
.row .t{font-size:16px;font-weight:700}.row .s{font-size:13px;color:var(--mu);margin-top:2px;line-height:18px}.row .r{margin-left:auto;font-size:14px;font-weight:700;color:var(--mu);display:flex;gap:4px;align-items:center}
.ico{width:44px;height:44px;border-radius:22px;background:var(--chip);color:var(--tx);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grid{display:grid;gap:18px 0}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.gi{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.gi .ico{width:60px;height:60px;border-radius:22px}
.g3{animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
.btn{height:56px;width:100%;border:0;border-radius:18px;background:var(--br);color:var(--on);font-weight:800;font-size:17px}
.btn.sec2{background:var(--chip);color:var(--tx)}.btn:disabled{opacity:.35}
.row2{display:flex;gap:12px}.row2 .btn{height:52px;font-size:16px;border-radius:16px}
.cta{z-index:4;position:absolute;left:0;right:0;bottom:0;padding:12px 24px 24px;background:var(--bg);border-top:1px solid var(--ln)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--bg);border-top:1px solid var(--ln);display:flex;padding:0 8px;z-index:5}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--tt)}
.tabs button.on{color:var(--tx);font-weight:800}
.bar{display:flex;align-items:center;gap:4px;padding:16px 12px 0}.bar b{font-size:18px;font-weight:800}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;background:var(--chip);font-weight:800;font-size:14px;border:0}
.field{margin:24px 24px 0;padding-bottom:10px;border-bottom:2px solid var(--tx)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);padding:0 24px}.keys button{height:60px;border:0;background:none;font-size:26px;font-weight:700}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fadebg .2s}.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:28px 24px 28px;z-index:21;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fadebg{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:24px;right:24px;bottom:100px;background:var(--tx);color:var(--bg);padding:14px 18px;border-radius:16px;font-size:14px;font-weight:700;z-index:30;animation:fade .2s}
.warn{margin:20px 24px 0;padding-top:16px;border-top:1px solid var(--ln);display:flex;gap:12px;animation:fade .25s}
.check{width:104px;height:104px;border-radius:52px;background:var(--br);display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.check path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .25s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.splash{display:flex;align-items:center;justify-content:center;background:var(--bg)}.splash svg{animation:pop .7s cubic-bezier(.2,1.2,.3,1)}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ok)}
@keyframes dotin{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.fine{font-size:12px;line-height:17px;color:var(--tt)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--ln);position:relative;transition:background .22s;flex-shrink:0;cursor:pointer}.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .24s cubic-bezier(.3,1.4,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.2)}.sw.on{background:var(--br)}.sw.on i{transform:translateX(20px)}
.cv{transition:filter .35s,transform .35s}.cv.frozen{filter:grayscale(1) brightness(.92);transform:scale(.98)}.lk{opacity:0;transition:opacity .25s;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.cv.frozen .lk{opacity:1}
.snap{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 24px;scrollbar-width:none}.snap::-webkit-scrollbar{display:none}.snap>div{scroll-snap-align:center;flex:0 0 100%}
.bn{height:156px;border-radius:24px;padding:20px;display:flex;justify-content:space-between;align-items:center;color:#191F28}
.dots{display:flex;gap:6px;justify-content:center;padding-top:10px}.dots i{width:6px;height:6px;border-radius:3px;background:var(--ln);transition:all .2s}.dots i.on{width:16px;background:var(--tx)}
.misrow{display:flex;gap:10px}.mis{flex:1;border:0;background:var(--chip);border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--tx)}.mis b{font-size:13px;color:var(--lk)}.mis:disabled{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 24px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.cch{flex-shrink:0;height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--chip);font-weight:700;font-size:14px;color:var(--tx)}.cch.on{background:var(--tx);color:var(--bg)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:0 24px}
.pc{cursor:pointer}.pim{position:relative;aspect-ratio:1/1;border-radius:20px;background:var(--chip);display:flex;align-items:center;justify-content:center}
.hrt{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.dbadge{position:absolute;left:8px;bottom:8px;background:var(--er);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px}
.pn{font-size:14px;font-weight:700;margin-top:10px;line-height:19px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pm{font-size:12px;color:var(--mu);margin-top:2px}.pp{font-size:16px;margin-top:6px}.po{font-size:12px;color:var(--tt);text-decoration:line-through}.pc2{font-size:12px;color:var(--lk);font-weight:700;margin-top:4px}.ps{font-size:12px;color:var(--er);font-weight:700;margin-top:2px}
.fab{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;z-index:6;pointer-events:none}.fab button{pointer-events:auto;width:auto;height:48px;padding:0 22px;border-radius:24px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.seg{display:flex;gap:22px;padding:18px 24px 0;font-size:17px;font-weight:800}.seg button{border:0;background:none;padding:0 0 8px;color:var(--tt);font-weight:800;font-size:17px}.seg button.on{color:var(--tx);border-bottom:2px solid var(--tx)}
.bub{margin:12px 24px 0;padding:12px 14px;border-radius:14px;background:var(--tx);color:var(--bg);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;animation:fade .25s}.bub button{border:0;background:var(--br);color:var(--on);font-weight:800;border-radius:10px;height:32px;padding:0 14px}
.ecat{flex:0 0 68px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;border:0;background:none;color:var(--tx)}.ecat i{width:60px;height:60px;border-radius:30px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-style:normal;transition:box-shadow .2s}.ecat.on i{box-shadow:0 0 0 2px var(--br)}
.rcard{padding:0 24px 24px;cursor:pointer}.rimg{height:168px;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative}.rtag{position:absolute;left:12px;top:12px;background:var(--tx);color:var(--bg);font-size:12px;font-weight:800;padding:5px 10px;border-radius:12px}
.tl{display:flex;align-items:center;gap:14px;padding:9px 0;color:var(--tt);font-weight:700;font-size:15px}.tl i{width:22px;height:22px;border-radius:11px;background:var(--ln);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .3s}.tl.on{color:var(--tx)}.tl.on i,.tl.done i{background:var(--br)}.tl.done{color:var(--tx)}
.req{display:flex;gap:8px;flex-wrap:wrap}.req button{height:38px;padding:0 14px;border-radius:19px;border:0;background:var(--chip);font-weight:700;font-size:14px;color:var(--tx)}.req button.on{background:var(--tx);color:var(--bg)}
.mi{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln)}.mi .th{position:relative;width:84px;height:84px;border-radius:18px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex-shrink:0}.mi .plus{position:absolute;right:-6px;bottom:-6px;min-width:34px;height:34px;border-radius:17px;border:0;background:var(--br);color:var(--on);font-weight:800;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ahead{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.asr{margin:14px 24px 0;height:46px;border-radius:14px;background:var(--chip);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mu)}.asr input{border:0;background:none;outline:0;flex:1;font:inherit;font-size:15px;color:var(--tx)}
.agt{font-size:14px;font-weight:700;color:var(--mu);padding:30px 24px 4px}
.ar{display:flex;align-items:center;gap:14px;padding:11px 24px;cursor:pointer}.ar .t{font-size:16px;font-weight:700}.ar .s{font-size:13px;color:var(--mu);margin-top:2px;line-height:18px}.ar .g{width:34px;display:flex;justify-content:center;flex-shrink:0}
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;padding:6px 24px 0}.ag .gi .ico{width:60px;height:60px;border-radius:22px}
.dots6{display:flex;gap:14px;justify-content:center;padding:30px 0 6px}.dots6 i{width:16px;height:16px;border-radius:8px;background:var(--ln);transition:background .15s,transform .15s}.dots6 i.on{background:var(--br);transform:scale(1.18)}
.cb{width:26px;height:26px;border-radius:13px;border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;background:none;padding:0}.cb.on{background:var(--br);border-color:var(--br)}
.in{width:100%;height:52px;border:0;border-bottom:2px solid var(--ln);background:none;font:inherit;font-size:20px;font-weight:700;color:var(--tx);outline:0;padding:0;border-radius:0}.in:focus{border-color:var(--tx)}.lab{font-size:13px;color:var(--mu);margin-top:24px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>

return `${bar('Settings')}<div class="agt" style="padding-top:18px">My info</div>${sr('My info','','')}
<div class="agt">Authentication &amp; Security</div>${tr('Unlock with biometrics','Require Face/Fingerprint to open Itunda','bio')}${tr('Verify this device with biometrics','Skip retyping your password for step-up verification','devbio')}
<div class="agt">Display</div><div class="pad" style="padding-top:6px"><div style="font-size:16px;font-weight:700">Theme</div><div class="sm mu" style="margin:2px 0 10px">Match device, or force light/dark</div><div class="req">${[['system','System'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="${S.theme===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div></div>${sr('Text size','','')}${sr('Language','',L2[S.lang],'langSheet()')}
<div class="agt">Transfer &amp; Payment</div>${sr('Send','','')}${sr('Pay','','')}
<div class="agt">Legal Documents</div>${sr('Credit data usage policy','','')}${sr('Privacy policy','','')}${sr('Terms &amp; consent','','')}
<div class="agt">Devices</div><div class="ar" style="cursor:default"><div style="flex:1"><div class="t">Pixel 8 (this device)</div><div class="s">Trusted — can send money</div></div><span class="sm" style="color:var(--lk);font-weight:700" onclick="toast('Not built in this prototype')">Remove</span></div>
<div class="agt">Notifications</div>${sr('Manage notifications','','')}${tr('Money notifications','','money')}${tr('General notifications','','general')}${sr('Mark all read','','','S.nread=true;toast(\'All notifications marked read\')')}
<div class="pad" style="padding-top:28px"><button class="btn sec2" onclick="logOut()">Log out</button></div><div class="pad fine" style="padding-top:16px">Prototype settings. Your repo's text for these screens is used where it exists.</div>`},
transit:()=>{const low=S.tb<S.fare;return `${bar('Transit')}<div class="pad" style="padding-top:16px"><div class="sm mu">itunda Transit balance</div><div class="big" style="margin-top:4px">${fmt(S.tb)} RWF</div></div>
<div class="agt" style="padding-top:26px">Top up</div><div class="pad"><div class="req">${[1000,2000,5000].map(a=>`<button class="${S.topAmt===a?'on':''}" onclick="S.topAmt=${a};render('fade-none')">${fmt(a)} RWF</button>`).join('')}</div><button class="btn" style="margin-top:14px" ${S.topAmt>S.pay?'disabled':''} onclick="transitTop()">Top up ${fmt(S.topAmt)} RWF</button>${S.topAmt>S.pay?`<div style="color:var(--er);font-size:14px;margin-top:10px">Not enough balance — you have RWF ${fmt(S.pay)}</div>`:'<div class="sm mu" style="margin-top:8px">Taken from your itunda Pay balance.</div>'}</div>
<div class="agt">Tap to pay your fare</div><div class="pad"><div class="req">${['Kigali Bus Services','Royal Express'].map(o=>`<button class="${S.op===o?'on':''}" onclick="S.op='${o}';render('fade-none')">${o}</button>`).join('')}</div><div class="req" style="margin-top:10px">${[200,300,400,500].map(f=>`<button class="${S.fare===f?'on':''}" onclick="S.fare=${f};render('fade-none')">${f} RWF</button>`).join('')}</div><div class="sm mu" style="margin-top:10px;line-height:18px">Pick your real operator and fare — Kigali's real fares run 200-500 RWF depending on distance; itunda has no GPS-derived distance to calculate one automatically.</div><button class="btn" style="margin-top:14px" ${low?'disabled':''} onclick="transitTap()">${low?'Balance too low':'Tap '+S.fare+' RWF'}</button></div>
<div class="agt">Ride history</div>${S.rides.length?S.rides.map(r=>`<div class="ar" style="cursor:default"><div class="g">${gl('busstop',30)}</div><div style="flex:1"><div class="t" style="font-size:15px">${r[0]}</div></div><b>−${r[1]} RWF</b></div>`).join(''):`<div class="pad mu" style="font-size:14px;line-height:20px">No transit taps yet — once you tap to pay a fare, they'll show up here.</div>`}
<div class="pad fine" style="padding-top:26px;line-height:17px">Kigali's real public buses (Kigali Bus Services, Royal Express) run on a real contactless fare system called Tap&amp;Go, built by AC Group. itunda has no real partnership with them — this is itunda's own simulated transit balance: real money moves, real fares apply, it just isn't carried by a real bus card reader.</div>`},
nocard:()=>{const f=FIN[S.finish];return `${bar('Card')}${cardVis({frozen:false,last:'••••'},true)}<div class="pad" style="padding-top:26px"><div class="h1" style="font-size:24px;line-height:32px">Your own itunda card, in seconds</div><div class="mu" style="font-size:15px;margin-top:8px;line-height:22px">A real debit card for your itunda balance — no paperwork, no waiting.</div></div><div class="pad" style="padding-top:14px">${['No annual fee, ever','Issued instantly in the app — no branch visit','Set your own daily and monthly spend limits',"One-tap freeze if it's ever lost"].map(t=>`<div style="display:flex;align-items:center;gap:12px;padding:7px 0;font-size:15px;font-weight:600">${gl('verify',26)}${t}</div>`).join('')}</div><div class="pad" style="padding-top:18px"><div style="font-size:15px;font-weight:800;margin-bottom:10px">Which finish do you like?</div><div class="req">${Object.keys(FIN).map(k=>`<button class="${S.finish===k?'on':''}" onclick="setFinish('${k}')">${k}</button>`).join('')}</div></div><div class="cta"><button class="btn" onclick="getCard()">Get your ${S.finish} card</button></div>`},
card:()=>{const c=S.card;const sw=`<div class="sw ${c.frozen?'on':''}" id="sw_frozen" role="switch" aria-checked="${c.frozen}" tabindex="0" onclick="tgFreeze()"><i></i></div>`;return `${bar('Card')}${cardVis(c,false)}<div class="pad" style="padding-top:26px"><div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0"><div style="font-size:16px;font-weight:700" id="frzl">${c.frozen?'Unfreeze card':'Freeze card'}</div>${sw}</div>${row('lock','Change card PIN')}${row('cash','Report lost or stolen')}${row('receipt','Close card')}</div><div class="pad" style="padding-top:18px"><div style="font-size:18px;font-weight:800;margin-bottom:8px">Spend limits</div><div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0"><span class="mu">Daily limit</span><b>Today: 0 / 500,000 RWF</b></div><div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0"><span class="mu">Monthly limit</span><b>This month: 0 / 5,000,000 RWF</b></div></div><div class="pad" style="padding-top:22px"><div style="font-size:18px;font-weight:800">Recent card activity</div><div class="mu" style="font-size:14px;margin-top:8px;line-height:20px">No card purchases yet — once you use your card, they'll show up here.</div></div><div class="pad fine" style="padding-top:22px">itunda has no real card-network partnership yet, so this simulates a real card-present purchase. Limits and numbers here are sample data.</div>`},
product:()=>{const x=PRODS[S.pi],d=pct(x.p,x.o);return `${bar('Product')}<div style="padding:12px 24px 0"><div class="pim" style="aspect-ratio:auto;height:260px;border-radius:28px">${gl(x.g,132)}<button class="hrt" id="h${S.pi}" aria-label="Save" onclick="tgFav(${S.pi})" style="width:44px;height:44px">${heart(S.fav[S.pi])}</button></div></div><div class="pad" style="padding-top:20px"><div class="sm mu">${x.m}</div><div style="font-size:22px;font-weight:800;letter-spacing:-.4px;margin-top:4px;line-height:30px">${x.n}</div><div style="margin-top:14px;display:flex;align-items:baseline;gap:8px">${d?`<b style="color:var(--er);font-size:20px">${d}%</b>`:''}<b style="font-size:28px;letter-spacing:-.6px">${fmt(x.p)} RWF</b></div>${x.o?`<div class="po" style="font-size:14px">${fmt(x.o)} RWF</div>`:''}<div style="margin-top:12px;color:var(--lk);font-weight:800;font-size:14px">Earn ${fmt(Math.round(x.p*0.01))} RWF back (1% cashback)</div></div><div class="pad" style="padding-top:20px">${row('transit','Rider delivery','1 to 2 days','1,500 RWF')}${row('lock','Pay with itunda Pay','Balance '+fmt(S.pay)+' RWF')}${x.s<=5?`<div class="ps" style="padding-top:8px;font-size:14px">${x.s} left in stock</div>`:''}</div><div class="cta"><button class="btn" onclick="addCart(${S.pi})">Add to cart · ${fmt(x.p)} RWF</button></div>`},
scart:()=>{const ent=Object.entries(S.scart).filter(([i,q])=>q>0);const tot=scTotal()+1500,bad=tot>S.pay;const lines=ent.map(([i,q])=>{const x=PRODS[i];return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0"><div class="pim" style="width:56px;height:56px;border-radius:16px;aspect-ratio:auto;flex-shrink:0">${gl(x.g,34)}</div><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;line-height:20px">${x.n}</div><div class="sm mu">${fmt(x.p)} RWF</div></div><div style="display:flex;align-items:center;gap:8px"><button class="ib" style="width:34px;height:34px;border-radius:17px;background:var(--chip)" aria-label="Remove one" onclick="scAdj(${i},-1)">${ic('minus',16)}</button><b style="min-width:14px;text-align:center">${q}</b><button class="ib" style="width:34px;height:34px;border-radius:17px;background:var(--chip)" aria-label="Add one" onclick="scAdj(${i},1)">${ic('plus',16)}</button></div></div>`}).join('');return `${bar('Cart')}<div class="pad" style="padding-top:12px">${lines}</div><div class="pad" style="padding-top:12px"><div style="display:flex;justify-content:space-between;height:44px;align-items:center;font-size:15px;border-top:1px solid var(--ln)"><span class="mu">Delivery</span><b>1,500 RWF</b></div><div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:8px"><span style="font-size:18px;font-weight:800">Total</span><span style="font-size:28px;font-weight:800;letter-spacing:-.5px">${fmt(tot)} RWF</span></div><div style="margin-top:14px;display:flex;justify-content:space-between;font-size:14px"><span class="mu">Pay from</span><b>itunda Pay · ${fmt(S.pay)} RWF</b></div>${bad?`<div style="color:var(--er);font-size:14px;margin-top:10px">Not enough balance — you have RWF ${fmt(S.pay)}</div>`:''}</div><div class="cta"><button class="btn" ${bad||!ent.length?'disabled':''} onclick="shopPay()">Pay ${fmt(tot)} RWF</button></div>`},
erest:()=>{const r=REST[S.er],n=eCount(),sub=eSub();const items=r.items.map((it,k)=>`<div class="mi"><div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:800">${it[0]}</div>${it[1]?`<div class="sm mu" style="margin-top:3px;line-height:18px">${it[1]}</div>`:''}<div style="font-size:15px;font-weight:700;margin-top:8px">${fmt(it[2])} RWF</div></div><div class="th">${gl(it[3],48)}<button class="plus" aria-label="Add ${it[0]}" onclick="eAdd(${k})">${S.ecart[k]?S.ecart[k]:'+'}</button></div></div>`).join('');
return `<div style="height:210px;background:${r.bg};display:flex;align-items:center;justify-content:center;position:relative"><button class="ib" aria-label="Back" onclick="back()" style="position:absolute;left:8px;top:14px;background:var(--bg);border-radius:22px">${ic('back',24)}</button>${gl(r.g,120)}</div><div style="margin-top:-24px;background:var(--bg);border-radius:28px 28px 0 0;position:relative;padding:24px 24px 0"><div style="font-size:24px;font-weight:800;letter-spacing:-.5px">${r.n}</div><div class="sm" style="margin-top:6px;font-weight:700">★ ${r.r} <span class="mu" style="font-weight:500">(${r.rc} reviews) · ${r.d} km</span></div><div class="req" style="margin-top:16px"><button class="${S.pickup?'':'on'}" onclick="setPickup(false)">Delivery</button><button class="${S.pickup?'on':''}" onclick="setPickup(true)">Pickup</button></div><div class="sm mu" style="margin-top:10px">${S.pickup?'Ready in 10-15 min · Pickup is free':r.t+' min · '+(r.fee?fmt(r.fee)+' RWF delivery':'Free delivery')} · Min ${fmt(r.min)} RWF</div><div style="display:flex;gap:20px;font-size:16px;font-weight:800;padding-top:22px;border-bottom:1px solid var(--ln)"><span style="border-bottom:2px solid var(--tx);padding-bottom:8px">Menu</span><span style="color:var(--tt)">Info</span><span style="color:var(--tt)">Reviews</span></div><div style="font-size:18px;font-weight:800;padding-top:18px">Popular</div>${items}</div><div class="pad fine" style="padding:20px 24px 0">Menus, prices and ratings are sample data.</div>${n?`<div class="cta"><button class="btn" onclick="eCart()">View cart · ${n} · ${fmt(sub)} RWF</button></div>`:''}`},
echeck:()=>{const r=REST[S.er],sub=eSub(),fee=eFee(),tot=sub+fee,bad=tot>S.pay,short=sub<r.min;const lines=Object.entries(S.ecart).filter(([k,q])=>q>0).map(([k,q])=>{const it=r.items[k];return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0"><div style="flex:1;font-size:15px;font-weight:700">${it[0]}<div class="sm mu" style="font-weight:500">${fmt(it[2])} RWF</div></div><button class="ib" style="width:34px;height:34px;border-radius:17px;background:var(--chip)" aria-label="Remove one" onclick="eAdj(${k},-1)">${ic('minus',16)}</button><b style="min-width:14px;text-align:center">${q}</b><button class="ib" style="width:34px;height:34px;border-radius:17px;background:var(--chip)" aria-label="Add one" onclick="eAdj(${k},1)">${ic('plus',16)}</button></div>`}).join('');
return `${bar('Cart')}<div class="pad" style="padding-top:12px"><div class="req"><button class="${S.pickup?'':'on'}" onclick="setPickup(false);render('fade-none')">Delivery</button><button class="${S.pickup?'on':''}" onclick="setPickup(true);render('fade-none')">Pickup</button></div><div style="margin-top:16px;display:flex;align-items:center;gap:12px">${gl('gov',34)}<div><div style="font-size:15px;font-weight:800">${S.pickup?r.n:'Home'}</div><div class="sm mu">${S.pickup?r.d+' km away · ready in 10-15 min':'Kimironko, KG 11 Ave · '+r.t+' min'}</div></div></div></div>
${S.pickup?'':`<div class="pad" style="padding-top:18px"><div style="font-size:15px;font-weight:800;margin-bottom:10px">Request for the rider</div><div class="req">${['Leave at the door','Hand it to me','Call when nearby'].map(q=>`<button class="${S.req===q?'on':''}" onclick="setReq('${q}')">${q}</button>`).join('')}</div></div>`}
<div class="pad" style="padding-top:20px"><div style="font-size:17px;font-weight:800">${r.n}</div>${lines}</div><div class="pad" style="padding-top:14px"><div style="display:flex;justify-content:space-between;height:40px;align-items:center;font-size:15px;border-top:1px solid var(--ln)"><span class="mu">Items</span><b>${fmt(sub)} RWF</b></div><div style="display:flex;justify-content:space-between;height:36px;align-items:center;font-size:15px"><span class="mu">${S.pickup?'Pickup':'Delivery'}</span><b>${fee?fmt(fee)+' RWF':'Free'}</b></div><div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:6px"><span style="font-size:18px;font-weight:800">Total</span><span style="font-size:28px;font-weight:800;letter-spacing:-.5px">${fmt(tot)} RWF</span></div><div style="margin-top:14px;display:flex;justify-content:space-between;font-size:14px"><span class="mu">Pay with</span><b>itunda Pay · ${fmt(S.pay)} RWF</b></div>${short?`<div style="color:var(--er);font-size:14px;margin-top:10px">Add RWF ${fmt(r.min-sub)} more to reach the minimum order.</div>`:''}${bad?`<div style="color:var(--er);font-size:14px;margin-top:10px">Not enough balance — you have RWF ${fmt(S.pay)}</div>`:''}</div><div class="cta"><button class="btn" ${bad||short?'disabled':''} onclick="ePay()">Pay ${fmt(tot)} RWF</button></div>`},
etrack:()=>{const r=REST[S.er],st=ESTEPS(),k=S.trk;const eta=k>=3?(S.pickup?'Picked up':'Delivered'):k===2?(S.pickup?'Ready now':'Arriving in 8 min'):k===1?'About '+(r.tm-2)+' min':'About '+r.tm+' min';
return `${bar(S.pickup?'Your pickup':'Your delivery')}<div class="pad" style="padding-top:12px"><div id="eta" style="font-size:28px;font-weight:800;letter-spacing:-.6px">${eta}</div><div class="sm mu" style="margin-top:4px">${r.n} · ${S.pickup?'Pickup':'to Kimironko, KG 11 Ave'}</div></div><div class="pad" style="padding-top:16px"><svg viewBox="0 0 342 190" width="100%" style="border-radius:24px;display:block" role="img" aria-label="Map showing the rider on the way"><rect width="342" height="190" fill="var(--chip)"/><path d="M0 62L342 40M0 132L342 152M92 0L112 190M232 0L212 190" stroke="var(--bg)" stroke-width="12" opacity=".85" fill="none"/><path id="rt" d="M60 150C120 150 130 76 190 76S270 62 290 40" fill="none" stroke="var(--br)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/><circle cx="60" cy="150" r="15" fill="var(--br)"/><svg x="50" y="140" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121216" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P.bag}"/></svg><circle cx="290" cy="40" r="15" fill="var(--tx)"/><svg x="280" y="30" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P.home}"/></svg>${S.pickup?'':`<circle r="9" fill="#fff" stroke="var(--tx)" stroke-width="3"><animateMotion dur="11s" begin="0s" fill="freeze" keyPoints="0;0;0.35;1" keyTimes="0;0.5;0.55;1" calcMode="linear"><mpath href="#rt"/></animateMotion></circle>`}</svg></div>
<div class="pad" style="padding-top:18px" id="tls">${st.map((s,i)=>`<div class="tl ${i<k?'done':i===k?'on':''}" id="tl${i}"><i>${i<=k?ic('plus',0):''}</i>${s}</div>`).join('')}</div>
<div class="pad" id="rider" style="padding-top:12px;${k>=2&&!S.pickup?'':'display:none'}"><div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)"><div class="ico">${gl('moto',34)}</div><div style="flex:1"><div style="font-size:15px;font-weight:800">Jean Claude</div><div class="sm mu">Your rider · ★ 4.9</div></div><button class="ib" aria-label="Call rider" onclick="toast('Calling is not in this prototype')" style="background:var(--chip);border-radius:22px">${ic('phone',22)}</button></div></div>
<div class="pad fine" style="padding-top:10px">Order tracking and the rider are simulated for this prototype.</div><div class="cta"><button class="btn" id="edone" onclick="done()" ${k>=3?'':'disabled'}>${k>=3?'Done':'Tracking your order'}</button></div>`},
messages:()=>`<div class="ahead"><b style="font-size:24px;letter-spacing:-.5px">Messages</b><div style="display:flex;gap:2px"><button class="ib" aria-label="Search" onclick="toast('Not built in this prototype')">${ic('search',24)}</button><button class="ib" aria-label="New message" onclick="toast('Not built in this prototype')">${ic('pencil',24)}</button></div></div><div style="padding-top:8px">${THREADS.map(t=>{const u=S.read[t.id]?0:t.u;return `<div class="ar tap" style="padding:12px 24px" onclick="openChat('${t.id}')"><div class="ico" style="width:52px;height:52px;border-radius:26px">${gl(t.g,34)}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">${t.n}</b><span class="sm mu">${t.t}</span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px"><span class="sm mu" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${prev(S.msgs[t.id])}</span>${u?`<span style="min-width:20px;height:20px;border-radius:10px;background:var(--br);color:var(--on);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px">${u}</span>`:''}</div></div></div>`}).join('')}</div><div class="pad fine" style="padding-top:20px">Conversations are sample data. Send money, gifts and split bills right in a chat.</div>`,
chat:()=>{const t=thr();const ms=S.msgs[t.id];return `${bar(t.n)}<div class="pad sm mu" style="padding-top:2px;padding-left:68px;margin-top:-6px">${t.sub}</div><div class="pad" style="padding-top:14px">${ms.length?ms.map(bubble).join(''):'<div class="mu" style="padding-top:30px;text-align:center">No messages yet. Say hello.</div>'}</div><div class="cta" style="display:flex;gap:8px;align-items:center;padding:10px 12px 14px"><button class="ib" aria-label="Send money, a gift or split a bill" onclick="chatMenu()" style="background:var(--chip);border-radius:22px;flex-shrink:0">${ic('plus',22)}</button><input id="msg" placeholder="Message" aria-label="Message" onkeydown="if(event.key==='Enter')chatSend()" style="flex:1;min-width:0;height:44px;border:0;border-radius:22px;background:var(--chip);padding:0 16px;font:inherit;font-size:15px;color:var(--tx);outline:0"><button class="ib" aria-label="Send message" onclick="chatSend()" style="background:var(--br);border-radius:22px;flex-shrink:0">${ic('send',20,'#121216')}</button></div>`},

function draw(mode,name){let html=screens[name]();const cm=html.match(/<div class="cta"[^>]*>[\s\S]*?<\/div>/);if(cm)html=html.replace(cm[0],'');const fm=html.match(/<div class="fab">[\s\S]*?<\/button><\/div>/);if(fm)html=html.replace(fm[0],'');const bar=(S.stack.length||!S.auth)?'':tabbar();$('#view').innerHTML=`<div class="screen ${mode}" id="sc">${html}</div>${cm?cm[0]:''}${fm?fm[0]:''}${bar}`;if(name==='home')countUp()}

function countUp(){const el=$('#bal');if(!el)return;const from=bal0,to=S.bank,t0=performance.now();const d=S.first?900:700;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);if(el)el.textContent=fmt(Math.round(from+(to-from)*(reduce?1:e)));if(p<1&&el.isConnected)requestAnimationFrame(f)}requestAnimationFrame(f);bal0=to;S.first=false}

function splitMake(){S.msgs[S.chat].push(['split',S.splitAmt,false]);closeSheet();render('fade-none');chatEnd()}
function paySplit(i){const x=S.msgs[S.chat][i],share=Math.round(x[1]/2);if(share>S.pay){toast('Not enough balance — you have RWF '+fmt(S.pay));return}S.pay-=share;x[2]=true;const y=$('#sc')?$('#sc').scrollTop:0;render('fade-none');if($('#sc'))$('#sc').scrollTop=y;toast('Paid '+fmt(share)+' RWF')}
function notifSheet(){const it=[];S.orders.forEach(o=>it.push([o.k==='Eats order'?'restaurant':'bag',o.k+': '+o.s,fmt(o.t)+' RWF']));THREADS.forEach(t=>{if(!S.read[t.id]&&t.u)it.push(['chat',t.n+' sent you a message',prev(S.msgs[t.id])])});it.push(['celebrate','Daily check-in is ready','Claim +50 RWF in Shop. Sample reward.'],['bolt','31-day savings','Keep your streak going. Sample reminder.']);$('#layer').innerHTML=`<div class="sheetbg" onclick="closeSheet()"></div><div class="sheet" style="max-height:78%;overflow-y:auto"><div class="h1" style="font-size:22px;line-height:30px;margin-bottom:8px">Notifications</div>${it.map(([g,t,s])=>`<div class="row" style="cursor:default"><div class="ico">${gl(g,30)}</div><div><div class="t" style="font-size:15px">${t}</div><div class="s">${s}</div></div></div>`).join('')}<button class="btn sec2" style="margin-top:14px" onclick="S.nread=true;closeSheet();render('fade-none')">Mark all as read</button></div>`}
function obGo(s){S.obStep=s;if(s==='obPin'){S.ob.pin='';S.ob.pin2='';S.ob.err=''}render('push')}
function obBack(){const m={obNotFound:'obPhone',obName:'obNotFound',obTerms:'obName',obPin:'obTerms',obPin2:'obPin'};S.obStep=m[S.obStep]||'obPhone';render('pop')}
function obSkip(){S.auth=true;S.obStep=null;render('fade')}
function obF(k,v){S.ob[k]=v;const b=$('#obnext');if(b)b.disabled=!(S.ob.first.trim()&&S.ob.last.trim())}
function tcTog(k){S.ob[k]=!S.ob[k];render('fade-none')}
function tcAll(){const v=!(S.ob.t&&S.ob.p&&S.ob.c&&S.ob.m);S.ob.t=S.ob.p=S.ob.c=S.ob.m=v;render('fade-none')}
function obPhoneNext(){const b=$('#obnext');b.disabled=true;b.textContent='Checking…';setTimeout(()=>obGo('obNotFound'),700)}
function obKey(d){const o=S.ob;if(S.obStep==='obPhone'){o.ph=d==='del'?o.ph.slice(0,-1):(o.ph.length<9?o.ph+d:o.ph);$('#phv').textContent=fmtPh(o.ph);$('#obnext').disabled=o.ph.length<9;return}
 const k=S.obStep==='obPin'?'pin':'pin2';o[k]=d==='del'?o[k].slice(0,-1):(o[k].length<6?o[k]+d:o[k]);$('#pd').innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i<o[k].length?'on':''}"></i>`).join('');
 if(S.obStep==='obPin'&&o.pin.length===6)setTimeout(()=>obGo('obPin2'),180);
 if(S.obStep==='obPin2'){if(o.pin2.length===6&&o.pin2!==o.pin){o.err="That didn't match. Try again.";o.pin2='';setTimeout(()=>render('fade-none'),250)}else{o.err='';$('#pe').textContent='';$('#obnext').disabled=!(o.pin2.length===6&&o.pin2===o.pin)}}}
function obCreate(){S.name=(S.ob.first.trim()+' '+S.ob.last.trim()).trim();S.obStep='obDone';render('push')}
function obStart(){S.auth=true;S.obStep=null;render('fade')}
function setFinish(f){S.finish=f;render('fade-none')}
function tgFreeze(){S.card.frozen=!S.card.frozen;$('#sw_frozen').classList.toggle('on',S.card.frozen);$('#cv').classList.toggle('frozen',S.card.frozen);$('#cst').textContent=S.card.frozen?'Frozen':'✓ Active';$('#frzl').textContent=S.card.frozen?'Unfreeze card':'Freeze card'}
function openSettings(){S.stack=['settings'];render('push')}
function tgSet(k){S.set[k]=!S.set[k];const s=$('#ss_'+k);s.classList.toggle('on',S.set[k]);s.setAttribute('aria-checked',S.set[k])}
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t==='system'?'':t;render('fade-none')}
function logOut(){S.auth=false;S.stack=[];S.obStep='obPhone';S.ob={ph:'',first:'',last:'',t:false,p:false,c:false,m:false,pin:'',pin2:'',err:''};render('fade')}
function openTransit(){S.stack=['transit'];render('push')}
function transitTop(){if(S.topAmt>S.pay)return;S.pay-=S.topAmt;S.tb+=S.topAmt;render('fade-none');toast('Topped up '+fmt(S.topAmt)+' RWF')}
function transitTap(){if(S.tb<S.fare)return;S.tb-=S.fare;S.rides.unshift([S.op,S.fare]);render('fade-none');toast('Tapped '+S.fare+' RWF at '+S.op)}
function openBank(){S.stack=['bank'];render('push')}
function open31(){S.stack.push('save31');render('push')}
function tab(k){S.tab=k;S.stack=[];render('fade')}
function flow(){S.to='';S.amt='';S.flagged=false;S.stack=['recipient'];render('push')}
function back(){S.stack.pop();render('pop')}
function pick(p,f){S.to=p;S.flagged=!!f;render('fade-none')}
function amount(){S.amt='';S.stack.push('amount');render('push')}
function key(k){if(k==='max')S.amt=String(S.bank);else if(k==='⌫')S.amt=S.amt.slice(0,-1);else if(S.amt.length<9)S.amt=(S.amt+k).replace(/^0+/,'');const v=S.amt?Number(S.amt):0,bad=v>S.bank;$('#amt').textContent=v?fmt(v):'0';$('#amt').parentElement.style.color=bad?'var(--er)':'var(--tx)';const m=$('#msg');m.style.color=bad?'var(--er)':'var(--mu)';m.textContent=amtMsg(bad);$('#go').disabled=!(v&&!bad)}
function confirm_(){const v=Number(S.amt);$('#layer').innerHTML=`<div class="sheetbg" onclick="closeSheet()"></div><div class="sheet"><div style="margin-bottom:12px">${gl('verified3d',60)}</div><div class="h1" style="font-size:22px;line-height:30px">Confirm it's you</div><div class="mu" style="font-size:15px;margin:8px 0 24px">Send ${fmt(v)} RWF to ${S.to}</div><button class="btn" onclick="finish()">Confirm</button></div>`}
function closeSheet(){$('#layer').innerHTML=''}
function finish(){closeSheet();S.sentAmt=Number(S.amt);S.bank-=S.sentAmt;S.stack=['sent'];render('push')}
function done(){S.oN=null;S.oE=null;S.stack=[];S.tab='home';render('fade')}
function sheetAdd(){$('#layer').innerHTML=`<div class="sheetbg" onclick="closeSheet()"></div><div class="sheet"><div style="margin-bottom:12px">${gl('cashin3d',60)}</div><div class="h1" style="font-size:22px;line-height:30px">${t('am')}</div><div class="mu" style="font-size:15px;margin:8px 0 24px">${t('an')}</div><button class="btn sec2" onclick="closeSheet()">${t('cn')}</button></div>`}
const o=document.createElement('div');o.className='screen splash';o.innerHTML=knot(120);$('#view').appendChild(o);
setTimeout(()=>render('fade'),1300);
</script>
</body>
</html>
