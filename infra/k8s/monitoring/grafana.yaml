apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-itunda-private-cloud
  namespace: monitoring
data:
  itunda-private-cloud.json: |
    {
      "title": "itunda private cloud",
      "uid": "itunda-private-cloud",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Node CPU busy %",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{job=\"itunda-node-exporter\",mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Node memory available %",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "(node_memory_MemAvailable_bytes{job=\"itunda-node-exporter\"} / node_memory_MemTotal_bytes{job=\"itunda-node-exporter\"}) * 100",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "MySQL role by node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "itunda_mysql_role_info{job=\"itunda-node-exporter\"} == 1",
              "legendFormat": "{{node}} {{role}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "MySQL replica lag seconds",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "itunda_mysql_replica_lag_seconds{job=\"itunda-node-exporter\"}",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Redis role by node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "itunda_redis_role_info{job=\"itunda-node-exporter\"} == 1",
              "legendFormat": "{{node}} {{role}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Kafka quorum voters",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "itunda_kafka_quorum_voters_count{job=\"itunda-node-exporter\"}",
              "legendFormat": "{{node}}"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provisioning
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provisioning
        configMap:
          name: grafana-dashboard-provisioning
      - name: dashboards
        projected:
          sources:
          - configMap:
              name: grafana-dashboard-itunda-fleet
          - configMap:
              name: grafana-dashboard-itunda-bank
          - configMap:
              name: grafana-dashboard-itunda-pay
          - configMap:
              name: grafana-dashboard-itunda-merchant
          - configMap:
              name: grafana-dashboard-itunda-wealth
          - configMap:
              name: grafana-dashboard-itunda-insurance
          - configMap:
              name: grafana-dashboard-itunda-talk
          - configMap:
              name: grafana-dashboard-itunda-eats
          - configMap:
              name: grafana-dashboard-itunda-rideshare
          - configMap:
              name: grafana-dashboard-itunda-shop
          - configMap:
              name: grafana-dashboard-itunda-bills
          - configMap:
              name: grafana-dashboard-itunda-agents
          - configMap:
              name: grafana-dashboard-itunda-card
          - configMap:
              name: grafana-dashboard-itunda-transit
          - configMap:
              name: grafana-dashboard-itunda-certificate
          - configMap:
              name: grafana-dashboard-itunda-vehicle
          - configMap:
              name: grafana-dashboard-itunda-partners
          - configMap:
              name: grafana-dashboard-itunda-identity
          - configMap:
              name: grafana-dashboard-itunda-overview
          - configMap:
              name: grafana-dashboard-itunda-knowledge
          - configMap:
              name: grafana-dashboard-itunda-private-cloud
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  # Dev-only default -- rotate before this namespace ever points at a real cluster.
  password: itunda-local-dev-only
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
  type: ClusterIP
