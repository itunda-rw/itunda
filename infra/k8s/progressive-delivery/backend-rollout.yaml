apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: itunda
spec:
  selector:
    app: backend
  ports:
  - port: 4001
    targetPort: 4001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-stable
  namespace: itunda
spec:
  selector:
    app: backend
  ports:
  - port: 4001
    targetPort: 4001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: itunda
spec:
  selector:
    app: backend
  ports:
  - port: 4001
    targetPort: 4001
  type: ClusterIP
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: itunda
spec:
  replicas: 4
  minReadySeconds: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend
  strategy:
    canary:
      stableService: backend-stable
      canaryService: backend-canary
      trafficRouting:
        istio:
          virtualServices:
          - name: backend
            routes:
            - primary
      steps:
      - setWeight: 10
      - pause:
          duration: 5m
      - setWeight: 25
      - pause:
          duration: 10m
      - setWeight: 50
      - pause: {}
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "4001"
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyCPULimit: "200m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyMemoryLimit: "128Mi"
        # Makes istio-init block app container start until Envoy is actually
        # ready to accept traffic, closing a real (if narrow) race window.
        # Investigated as a candidate fix for a long 2026-07-24 crash-loop
        # that turned out to have a different root cause (see excludeOutboundPorts
        # below and SeedDataRunner.kt's git history for the real story) -- kept
        # anyway since it's correct, standard hygiene on its own merits.
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
        # MySQL/Redis/Kafka run as plain Docker containers on the node, not as
        # mesh services -- routing that traffic through Envoy buys nothing (no
        # mTLS, no mesh-aware LB target) for no reason. Also investigated
        # during the same 2026-07-24 incident and also not the actual cause
        # (a `kubectl patch --type merge` on this container's array had silently
        # wiped DB_HOST/DB_PORT/etc, so the app was really just connecting to
        # `localhost` -- "Connection refused" was 100% accurate, just not for
        # the reason assumed at the time). Kept as legitimate hygiene: it
        # removes needless mesh overhead for traffic that was never going to a
        # mesh member.
        traffic.sidecar.istio.io/excludeOutboundPorts: "3306,6379,9092"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: ghcr.io/itunda/backend:latest
        ports:
        - containerPort: 4001
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: port
        - name: DB_NAME
          value: "itunda"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: port
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: itunda-jwt-secret
              key: secret
        - name: UPLOAD_DIR
          value: "/uploads"
        # Real self-hosted OSRM/Nominatim (2026-07-27) -- these containers run directly
        # on this same node (itunda-dc-a, 192.168.252.4), not as k8s-managed pods, reached
        # via the node's own IP + published host ports. These vars were never actually
        # set on this manifest (only ever patched ad hoc onto the live cluster object,
        # a Deployment predating this Rollout) -- every maps search/reverse/directions
        # call silently no-op'd via application.yml's own "empty means fall back" default
        # until this was found and fixed live. Committing them here so a future
        # `kubectl apply -f` of this manifest can't silently regress the same outage.
        - name: OSRM_BASE_URL
          value: "http://192.168.252.4:5000"
        - name: OSRM_FOOT_BASE_URL
          value: "http://192.168.252.4:5001"
        - name: NOMINATIM_BASE_URL
          value: "http://192.168.252.4:8088"
        # Real heap-ergonomics fix (2026-07-27) -- the JVM's default MaxHeapSize is 25%
        # of the container's *memory limit*, so even a generous limit gave only ~512MB
        # of real heap unless told otherwise. Discovered live while chasing an
        # intermittent multi-second-to-90-second hang that turned out to have a
        # different root cause entirely (a real infinite loop in
        # MerchantBookingService.getAvailableSlots, see that file's own git history) --
        # kept anyway since a 25%-of-limit heap is genuinely too tight for this app's
        # size now, real hygiene on its own merits.
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50"
        volumeMounts:
        - name: uploads
          mountPath: /uploads
        resources:
          # No explicit limits (2026-07-27) -- governed entirely by the itunda-limits
          # namespace LimitRange instead (see infra/k8s/private-cloud/limitrange.yaml),
          # whose defaults were raised the same pass (memory 512Mi->2Gi, cpu 500m->2)
          # after a real cgroup cpu.stat check showed this container throttled in 49%
          # of scheduling periods under the old 1-core cap -- invisible to a JVM thread
          # dump (a throttled thread still shows RUNNABLE, it's just not scheduled by
          # the kernel). cpu request lowered 500m->200m (2026-07-24): this single-node,
          # 2-vCPU cluster runs at ~100% CPU *requests* just from system pods
          # (kube-apiserver/etcd/controller-manager/istiod) plus the other
          # itunda services -- 500m left zero headroom and caused real
          # "Insufficient cpu" FailedScheduling on this exact redeploy.
          requests:
            memory: "512Mi"
            cpu: "200m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          initialDelaySeconds: 45
          periodSeconds: 15
          # Real fix (2026-07-27) -- Kubernetes' own 1s default timeout is far too tight
          # for a JVM under any real GC/request-processing load; this cluster's
          # payment-service/ledger-service each had 60-70 restarts before this same fix
          # was applied to all 4 services, all consistent with kubelet hard-killing
          # containers that were still alive, just briefly slow to answer a probe.
          timeoutSeconds: 5
      # Real photo upload storage (2026-07-24) -- see UploadController's own doc
      # comment. hostPath, not a PVC/storage class, because this private-cloud
      # deployment is a genuine single node (itunda-dc-a) -- a hostPath here is
      # exactly as durable as a PVC would be on one node, without needing a
      # provisioner this cluster doesn't have. Revisit if the cluster ever becomes
      # genuinely multi-node again.
      volumes:
      - name: uploads
        hostPath:
          path: /srv/itunda-uploads
          type: DirectoryOrCreate
