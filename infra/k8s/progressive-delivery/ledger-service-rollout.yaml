apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: itunda
spec:
  selector:
    app: ledger-service
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: itunda
spec:
  # Real architecture simplification (2026-08-11) -- see backend-rollout.yaml's own
  # doc comment for the full account (real single-node incident, Argo Rollouts
  # canary providing no real protection between two pods on the same box, its own
  # controller stuck "Degraded" with 1000+ restarts). Converted from an
  # argoproj.io/v1alpha1 Rollout to a plain Deployment; the stable/canary Service
  # split and Istio VirtualService weighting are gone with it.
  replicas: 1
  minReadySeconds: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ledger-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ledger-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: ledger-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: ledger-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: ledger-service
        # Keep a re-apply reproducible: pin the current audited private-registry
        # artifact by content digest, not a mutable tag.
        # Updated 2026-08-11 -- the prior digest (7de6d4e1...) developed the same
        # registry manifest corruption backend-rollout.yaml's own doc comment
        # describes (HTTP 500 on manifest HEAD), discovered live when this service's
        # Rollout->Deployment conversion deleted its only running pod and the
        # replacement couldn't pull. This digest is a fresh, real rebuild+push (no
        # code changes -- same source), via the same local-build/docker-save/
        # multipass-transfer/docker-load path backend used, since colima's own build
        # daemon can't reach this node's registry directly.
        image: 192.168.252.4:32000/itunda/ledger-service@sha256:46bf150fd8767c2129de4875ad3a060258d0910c4ce0e0806f8b57aba15c32cf
        ports:
        - containerPort: 8082
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-microservices-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-microservices-db-config
              key: port
        - name: DB_NAME
          value: "itunda_ledger"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: itunda-kafka-config
              key: bootstrap-servers
        resources:
          requests:
            memory: "384Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          # failureThreshold raised 30->60 (2026-08-11) -- preventive, matching
          # backend-rollout.yaml's own real measured fix (that JVM's actual boot
          # time was 338s against the old 300s budget under the tightened CPU
          # limit). This service's own boot time wasn't separately measured, but it
          # shares the same JVM/Spring Boot startup shape and the same node-wide CPU
          # contention, so the same real risk applies even without a service-specific
          # measurement.
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 45
          periodSeconds: 15
          # Real fix (2026-07-27) -- Kubernetes' 1s default timeout was too tight for
          # this fleet under real load; this service alone had 60+ restarts before this
          # fix, all consistent with kubelet hard-killing containers that were briefly
          # slow to answer a probe, not actually unhealthy. Raised to 5s across all 4
          # itunda services.
          timeoutSeconds: 5
