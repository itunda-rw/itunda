apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: itunda
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: itunda
spec:
  # Real architecture simplification (2026-08-11) -- see backend-rollout.yaml's own
  # doc comment for the full account (real single-node incident, Argo Rollouts
  # canary providing no real protection between two pods on the same box, its own
  # controller stuck "Degraded" with 1000+ restarts). Converted from an
  # argoproj.io/v1alpha1 Rollout to a plain Deployment; the stable/canary Service
  # split and Istio VirtualService weighting are gone with it.
  replicas: 1
  minReadySeconds: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Real fix (2026-08-11) -- runAsNonRoot alone was never actually enforceable
        # here: the image's Dockerfile creates its user via `adduser -S itunda`
        # (Alpine, a named, non-numeric user), and kubelet can't verify a named user
        # is non-root without a numeric UID. This silently worked before only because
        # Istio's sidecar-injection webhook happened to also stamp a runAsUser
        # override -- removing Istio (see backend-rollout.yaml's own doc comment)
        # exposed the real, pre-existing gap: every pod using this manifest was
        # crash-looping with CreateContainerConfigError the moment injection stopped
        # masking it. 100 confirmed live via `id itunda` inside the actual running
        # image, not guessed.
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: api-gateway
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: api-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api-gateway
        image: 192.168.252.4:32000/itunda/api-gateway@sha256:4f35621404760be39253c4d4d6ddabfeb3d581e9c43b17d198f82621ae14a3d5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://backend:4001"
        - name: LEDGER_SERVICE_URL
          value: "http://ledger-service:8082"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8081"
        - name: UPSTREAM_TIMEOUT_MS
          value: "15000"
        - name: CORS_ALLOWED_ORIGINS
          value: "https://itunda.duckdns.org,http://localhost:3000,http://localhost:5000,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5005"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          failureThreshold: 12
          periodSeconds: 5
          timeoutSeconds: 5
        # Real fix (2026-08-11) -- these two probes were previously mis-indented to
        # after the pod-level `volumes:` block, making them properties of the `tmp`
        # volume rather than this container (a real, pre-existing structural bug,
        # not introduced by this Rollout->Deployment conversion) -- Kubernetes' schema
        # validation likely silently dropped/ignored them, meaning this container may
        # never have had readiness/liveness probes actually enforced despite this
        # file appearing to define them. Moved back to their correct place alongside
        # startupProbe above.
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          # Real fix (2026-07-27) -- Kubernetes' 1s default timeout is too tight for
          # this fleet under real load; raised to 5s across all 4 itunda services
          # after chronic restarts traced to kubelet hard-killing containers that were
          # briefly slow to answer a probe, not actually unhealthy.
          timeoutSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
