apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: itunda
spec:
  selector:
    app: payment-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-stable
  namespace: itunda
spec:
  selector:
    app: payment-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-canary
  namespace: itunda
spec:
  selector:
    app: payment-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-service
  namespace: itunda
spec:
  replicas: 3
  minReadySeconds: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: payment-service
  strategy:
    canary:
      stableService: payment-service-stable
      canaryService: payment-service-canary
      trafficRouting:
        istio:
          virtualServices:
          - name: payment-service
            routes:
            - primary
      steps:
      - setWeight: 10
      - pause:
          duration: 5m
      - setWeight: 25
      - pause:
          duration: 10m
      - setWeight: 50
      - pause: {}
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyCPULimit: "200m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyMemoryLimit: "128Mi"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: payment-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: payment-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: payment-service
        image: ghcr.io/itunda/payment-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-microservices-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-microservices-db-config
              key: port
        - name: DB_NAME
          value: "itunda_payment"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: itunda-kafka-config
              key: bootstrap-servers
        resources:
          requests:
            memory: "384Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 45
          periodSeconds: 15
          # Real fix (2026-07-27) -- Kubernetes' 1s default timeout was too tight for
          # this fleet under real load; this service alone had 70+ restarts before this
          # fix, all consistent with kubelet hard-killing containers that were briefly
          # slow to answer a probe, not actually unhealthy. Raised to 5s across all 4
          # itunda services.
          timeoutSeconds: 5
