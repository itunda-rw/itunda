# Dev-only values for the ConfigMaps/Secret that infra/k8s/production/*.yaml
# reference but deliberately doesn't create (see that directory's README/header
# comments). NOT for any real cluster -- see README.md in this directory.
apiVersion: v1
kind: Secret
metadata:
  name: itunda-db-credentials
  namespace: itunda
type: Opaque
stringData:
  username: itunda
  password: itunda-local-dev-only
---
apiVersion: v1
kind: Secret
metadata:
  name: itunda-jwt-secret
  namespace: itunda
type: Opaque
stringData:
  secret: itunda-local-dev-jwt-secret-do-not-use-in-production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: itunda-db-config
  namespace: itunda
data:
  host: mysql.itunda.svc.cluster.local
  port: "3306"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: itunda-microservices-db-config
  namespace: itunda
data:
  host: mysql.itunda.svc.cluster.local
  port: "3306"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: itunda-redis-config
  namespace: itunda
data:
  host: redis.itunda.svc.cluster.local
  port: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: itunda-kafka-config
  namespace: itunda
data:
  bootstrap-servers: kafka.itunda.svc.cluster.local:9092
