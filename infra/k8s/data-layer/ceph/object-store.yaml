# =============================================================================
# Ceph Object Store (RADOS Gateway) - Itunda Platform
# =============================================================================
# S3-compatible object storage used by:
#   - Velero (cluster backups)
#   - Vitess (XtraBackup storage)
#   - Loki (log chunk archives)
#   - Mimir (metrics long-term storage)
#   - Application uploads and artifacts
#
# Features:
#   - Dual-gateway for HA
#   - Lifecycle rules: 30-day IA transition, 365-day expiry
#   - Bucket policies for access control
#   - TLS encryption in transit
# =============================================================================
---
# =============================================================================
# CephObjectStore - RADOS Gateway deployment
# =============================================================================
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: itunda-store
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-rgw
    app.kubernetes.io/instance: itunda-store
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: object-storage
    datacenter: kigali-dc1
  annotations:
    itunda.rw/owner: "platform-team"
    itunda.rw/description: "S3-compatible object store for backups and archives"
spec:
  # ---------------------------------------------------------------------------
  # Metadata pool (stores bucket indexes, user info)
  # ---------------------------------------------------------------------------
  metadataPool:
    failureDomain: host
    replicated:
      size: 3
    parameters:
      compression_mode: none

  # ---------------------------------------------------------------------------
  # Data pool (stores actual object data)
  # ---------------------------------------------------------------------------
  dataPool:
    failureDomain: host
    # Erasure coding for cost-efficient storage of backup data
    erasureCoded:
      dataChunks: 2
      codingChunks: 1
    parameters:
      compression_mode: aggressive  # Compress backup/archive data

  # ---------------------------------------------------------------------------
  # Gateway configuration
  # ---------------------------------------------------------------------------
  gateway:
    # 2 RGW instances for HA
    instances: 2
    port: 80
    securePort: 443
    sslCertificateRef: ""  # Use cert-manager in production
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    placement:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - rook-ceph-rgw
              topologyKey: kubernetes.io/hostname
    priorityClassName: system-cluster-critical
    # Service type for internal access
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9283"

  # ---------------------------------------------------------------------------
  # Health check
  # ---------------------------------------------------------------------------
  healthCheck:
    startupProbe:
      disabled: false
    readinessProbe:
      disabled: false
      periodSeconds: 10

  # ---------------------------------------------------------------------------
  # Preserve pools on delete
  # ---------------------------------------------------------------------------
  preservePoolsOnDelete: true

---
# =============================================================================
# CephObjectStoreUser - Backup service account
# =============================================================================
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: itunda-backup-user
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-rgw-user
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: backup
  annotations:
    itunda.rw/purpose: "Service account for Velero, Vitess, and Loki backup storage"
spec:
  store: itunda-store
  displayName: "Itunda Backup Service"
  quotas:
    maxBuckets: 20
    maxSize: "2Ti"
    maxObjects: 100000000  # 100M objects
  capabilities:
    user: "read"
    bucket: "*"
    metadata: "read"
    usage: "read"
    zone: "read"
---
# =============================================================================
# CephObjectStoreUser - Loki log archiver
# =============================================================================
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: itunda-loki-user
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-rgw-user
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: logging
  annotations:
    itunda.rw/purpose: "Service account for Loki log chunk storage"
spec:
  store: itunda-store
  displayName: "Itunda Loki Service"
  quotas:
    maxBuckets: 5
    maxSize: "500Gi"
  capabilities:
    user: "read"
    bucket: "*"
---
# =============================================================================
# CephObjectStoreUser - Mimir metrics
# =============================================================================
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: itunda-mimir-user
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-rgw-user
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: metrics
  annotations:
    itunda.rw/purpose: "Service account for Mimir long-term metrics storage"
spec:
  store: itunda-store
  displayName: "Itunda Mimir Service"
  quotas:
    maxBuckets: 10
    maxSize: "1Ti"
  capabilities:
    user: "read"
    bucket: "*"
---
# =============================================================================
# OBC - Velero backup bucket
# =============================================================================
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: itunda-velero-backups
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-bucket
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: backup
  annotations:
    itunda.rw/lifecycle: "30-day-ia-transition, 365-day-expiry"
spec:
  generateBucketName: itunda-velero-
  storageClassName: ceph-object
  additionalConfig:
    maxObjects: "10000000"
    maxSize: "500Gi"
---
# =============================================================================
# OBC - Vitess MySQL backup bucket
# =============================================================================
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: itunda-vitess-backups
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-bucket
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: database-backup
spec:
  generateBucketName: itunda-vitess-
  storageClassName: ceph-object
  additionalConfig:
    maxObjects: "5000000"
    maxSize: "1Ti"
---
# =============================================================================
# OBC - Loki log archive bucket
# =============================================================================
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: itunda-loki-chunks
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-bucket
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: logging
spec:
  generateBucketName: itunda-loki-
  storageClassName: ceph-object
  additionalConfig:
    maxObjects: "50000000"
    maxSize: "500Gi"
---
# =============================================================================
# Lifecycle Rules - Applied via CronJob (RGW lifecycle management)
# =============================================================================
# Ceph RGW supports S3-compatible lifecycle policies. This job configures them
# via the S3 API for each bucket after creation.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ceph-lifecycle-manager
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-lifecycle
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: storage-management
  annotations:
    itunda.rw/description: "Manages S3 lifecycle rules for all Itunda buckets"
spec:
  # Run daily at 03:00 EAT (00:00 UTC) to ensure rules are applied
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ceph-lifecycle
            app.kubernetes.io/part-of: itunda-platform
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          restartPolicy: OnFailure
          containers:
            - name: lifecycle-manager
              image: amazon/aws-cli:2.15.0
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export AWS_ENDPOINT_URL="http://rook-ceph-rgw-itunda-store.itunda-ceph.svc.cluster.local:80"

                  # Lifecycle policy: 30-day IA transition, 365-day expiration
                  LIFECYCLE_POLICY='{
                    "Rules": [
                      {
                        "ID": "TransitionToIA",
                        "Status": "Enabled",
                        "Filter": { "Prefix": "" },
                        "Transitions": [
                          {
                            "Days": 30,
                            "StorageClass": "STANDARD_IA"
                          }
                        ]
                      },
                      {
                        "ID": "ExpireOldObjects",
                        "Status": "Enabled",
                        "Filter": { "Prefix": "" },
                        "Expiration": {
                          "Days": 365
                        }
                      },
                      {
                        "ID": "CleanupMultipartUploads",
                        "Status": "Enabled",
                        "Filter": { "Prefix": "" },
                        "AbortIncompleteMultipartUpload": {
                          "DaysAfterInitiation": 7
                        }
                      },
                      {
                        "ID": "ExpireOldVersions",
                        "Status": "Enabled",
                        "Filter": { "Prefix": "" },
                        "NoncurrentVersionExpiration": {
                          "NoncurrentDays": 90
                        }
                      }
                    ]
                  }'

                  # Apply to each bucket
                  for BUCKET in $(aws s3 ls --endpoint-url "${AWS_ENDPOINT_URL}" | awk '{print $3}' | grep "^itunda-"); do
                    echo "Applying lifecycle policy to bucket: ${BUCKET}"
                    echo "${LIFECYCLE_POLICY}" | aws s3api put-bucket-lifecycle-configuration \
                      --bucket "${BUCKET}" \
                      --lifecycle-configuration file:///dev/stdin \
                      --endpoint-url "${AWS_ENDPOINT_URL}" || true
                  done

                  echo "Lifecycle policies applied successfully"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              envFrom:
                - secretRef:
                    name: rook-ceph-object-user-itunda-store-itunda-backup-user
---
# =============================================================================
# Bucket Policy ConfigMap (reference for operators)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-bucket-policies
  namespace: itunda-ceph
  labels:
    app.kubernetes.io/name: ceph-policies
    app.kubernetes.io/part-of: itunda-platform
    app.kubernetes.io/component: security
  annotations:
    itunda.rw/description: "S3 bucket policies for Itunda object storage"
data:
  velero-bucket-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "VeleroFullAccess",
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam:::user/itunda-backup-user" },
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:ListBucket",
            "s3:GetBucketLocation",
            "s3:ListMultipartUploadParts",
            "s3:AbortMultipartUpload"
          ],
          "Resource": [
            "arn:aws:s3:::itunda-velero-*",
            "arn:aws:s3:::itunda-velero-*/*"
          ]
        },
        {
          "Sid": "DenyUnencryptedTransport",
          "Effect": "Deny",
          "Principal": "*",
          "Action": "s3:*",
          "Resource": [
            "arn:aws:s3:::itunda-velero-*",
            "arn:aws:s3:::itunda-velero-*/*"
          ],
          "Condition": {
            "Bool": {
              "aws:SecureTransport": "false"
            }
          }
        }
      ]
    }
  vitess-bucket-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "VitessBackupAccess",
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam:::user/itunda-backup-user" },
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:ListBucket",
            "s3:GetBucketLocation"
          ],
          "Resource": [
            "arn:aws:s3:::itunda-vitess-*",
            "arn:aws:s3:::itunda-vitess-*/*"
          ]
        }
      ]
    }
  loki-bucket-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "LokiReadWriteAccess",
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam:::user/itunda-loki-user" },
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:ListBucket",
            "s3:GetBucketLocation"
          ],
          "Resource": [
            "arn:aws:s3:::itunda-loki-*",
            "arn:aws:s3:::itunda-loki-*/*"
          ]
        }
      ]
    }
