apiVersion: v1
kind: Namespace
metadata:
  name: registry-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itunda-registry
  namespace: registry-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itunda-registry
  template:
    metadata:
      labels:
        app: itunda-registry
    spec:
      nodeSelector:
        kubernetes.io/hostname: itunda-dc-a
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      containers:
      - name: registry
        image: registry:3
        imagePullPolicy: IfNotPresent
        env:
        - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
          value: /var/lib/registry
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /v2/
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /v2/
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: registry-data
          mountPath: /var/lib/registry
      volumes:
      - name: registry-data
        hostPath:
          path: /var/lib/itunda-registry
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: itunda-registry
  namespace: registry-system
spec:
  selector:
    app: itunda-registry
  ports:
  - name: registry
    port: 5000
    targetPort: 5000
    nodePort: 32000
  type: NodePort
