# Real TURN/STUN infra for itunda Talk's real 1:1 voice/video calling (itunda Talk
# redesign, 2026-08-28) -- coturn, a real, standard open-source TURN/STUN server.
#
# hostNetwork: true, deliberately: every existing Service in this cluster
# (nodeports.yaml, micro-frontends.yaml, registry-rehearsal.yaml) is fixed-port TCP
# NodePort, and this cluster's own kubeadm NodePort range (30000-32767) is
# incompatible with coturn's real UDP relay port range (49152-65535 by convention).
# hostNetwork binds coturn directly to the node's own real network interface,
# sidesteps the NodePort range limitation entirely -- a real, standard technique for
# a single-node bare-metal TURN deployment, and this cluster genuinely IS a single
# physical node (itunda-dc-b is status: disabled, see
# infra/openstack/cmdb/private-cloud-inventory.json) so there's no multi-node
# scheduling ambiguity this could otherwise introduce.
#
# The real shared TURN secret (used for coturn's use-auth-secret / REST API
# time-limited credential scheme -- see rw.itunda.calling's own
# GET /api/v1/calls/turn-credentials, which mints short-lived HMAC credentials
# rather than ever shipping a static long-lived one to a client) is NOT committed
# here -- provisioned out-of-band, same convention as backend.yaml's own DB/JWT
# secrets:
#   kubectl create secret generic itunda-turn-secret \
#     --from-literal=secret=<real value> -n itunda
#
# TCP fallback on 3478 alongside the UDP relay range -- coturn supports TURN-over-TCP
# for networks that block UDP outright (worse NAT-traversal characteristics, but a
# real, honest fallback rather than a hard failure).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: itunda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: itunda-dc-a
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      containers:
      - name: coturn
        image: coturn/coturn:4.6
        imagePullPolicy: IfNotPresent
        args:
        - "-n"
        - "--log-file=stdout"
        - "--listening-port=3478"
        - "--tls-listening-port=5349"
        - "--min-port=49160"
        - "--max-port=49200"
        # A deliberately narrow 40-port real relay range (not the conventional
        # 49152-65535, ~16k ports) -- this is a single-node, already
        # resource-constrained cluster; a handful of concurrent 1:1 calls is the
        # real, honest scope this pass targets (see the Talk redesign plan's own
        # "1:1 only, group calling deferred" scoping), not a large-scale relay
        # deployment.
        - "--use-auth-secret"
        - "--static-auth-secret=$(TURN_SECRET)"
        - "--realm=talk.itunda.rw"
        - "--no-cli"
        - "--no-tlsv1"
        - "--no-tlsv1_1"
        env:
        - name: TURN_SECRET
          valueFrom:
            secretKeyRef:
              name: itunda-turn-secret
              key: secret
        resources:
          # Real, conservative sizing -- coturn itself is lightweight when idle (no
          # active call), and only consumes real bandwidth/CPU while actively
          # relaying a real call's media, unlike a constant-footprint workload like
          # llama-server.
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
