apiVersion: v1
kind: Service
metadata:
  name: itunda-istio-ingress-nodeport
  namespace: istio-system
spec:
  type: NodePort
  selector:
    istio: ingressgateway
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30082
  - name: https
    port: 443
    targetPort: 8443
    nodePort: 30443
