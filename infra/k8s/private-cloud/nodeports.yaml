# Pragmatic external entrypoints for the two-node Multipass private cloud.
# The private cloud now uses kubeadm Kubernetes, but fixed NodePorts are still simpler for local/operator use and
# don't assume DNS or Ingress hostnames already exist.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: itunda
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  namespace: itunda
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - name: http
    port: 4001
    targetPort: 4001
    nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30300
