# Staging variant of infra/k8s/production/ledger-service.yaml -- see backend.yaml
# in this directory for the shared staging conventions (1 replica, smaller
# resources, itunda-staging namespace, :staging tag).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: itunda-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      # See infra/k8s/local-dev/kafka.yaml's comment on enableServiceLinks.
      enableServiceLinks: false
      containers:
      - name: ledger-service
        image: ghcr.io/itunda/ledger-service:staging
        ports:
        - containerPort: 8082
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-microservices-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-microservices-db-config
              key: port
        - name: DB_NAME
          value: "itunda_ledger"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: itunda-kafka-config
              key: bootstrap-servers
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "350m"
        # See infra/k8s/production/backend.yaml's comment on startupProbe.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 45
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: itunda-staging
spec:
  selector:
    app: ledger-service
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP
