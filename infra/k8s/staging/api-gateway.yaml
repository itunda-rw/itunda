# Staging variant of infra/k8s/production/api-gateway.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: itunda-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # See infra/k8s/local-dev/kafka.yaml's comment on enableServiceLinks.
      enableServiceLinks: false
      containers:
      - name: api-gateway
        image: ghcr.io/itunda/api-gateway:staging
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://backend:4001"
        - name: LEDGER_SERVICE_URL
          value: "http://ledger-service:8082"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8081"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: itunda-staging
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
