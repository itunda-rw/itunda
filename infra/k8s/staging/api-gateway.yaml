# Staging variant of infra/k8s/production/api-gateway.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: itunda-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # See infra/k8s/local-dev/kafka.yaml's comment on enableServiceLinks.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-gateway
        image: ghcr.io/itunda-rw/api-gateway:staging
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://backend:4001"
        - name: CARD_SERVICE_URL
          value: "http://card-service:4002"
        - name: INSURANCE_SERVICE_URL
          value: "http://insurance-service:4003"
        - name: AGENTS_SERVICE_URL
          value: "http://agents-service:4004"
        - name: LEDGER_SERVICE_URL
          value: "http://ledger-service:8082"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8081"
        - name: UPSTREAM_TIMEOUT_MS
          value: "15000"
        - name: CORS_ALLOWED_ORIGINS
          value: "http://localhost:3000,http://localhost:5000,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5005"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: itunda-staging
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
