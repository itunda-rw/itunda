# Staging variant of infra/k8s/production/backend.yaml: same shape, single
# replica, smaller resource footprint, itunda-staging namespace, :staging image
# tag. Secrets/ConfigMaps follow the same out-of-band provisioning convention as
# production (see backend.yaml's header comment there) -- provision a separate
# set of itunda-db-credentials/itunda-jwt-secret/itunda-*-config in
# itunda-staging, pointed at staging infrastructure, not production's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: itunda-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # See infra/k8s/local-dev/kafka.yaml's comment on enableServiceLinks.
      enableServiceLinks: false
      containers:
      - name: backend
        image: ghcr.io/itunda/backend:staging
        ports:
        - containerPort: 4001
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: port
        - name: DB_NAME
          value: "itunda"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: port
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: itunda-jwt-secret
              key: secret
        resources:
          requests:
            memory: "384Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        # See infra/k8s/production/backend.yaml's comment on startupProbe.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          initialDelaySeconds: 45
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: itunda-staging
spec:
  selector:
    app: backend
  ports:
  - port: 4001
    targetPort: 4001
  type: ClusterIP
