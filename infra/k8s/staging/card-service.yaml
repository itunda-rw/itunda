# Staging variant of infra/k8s/production/card-service.yaml: same shape, single
# replica, smaller resource footprint, itunda-staging namespace, :staging image
# tag. Same schema as `backend` (itunda-db-config), not ledger-service/
# payment-service's separate itunda-microservices-db-config -- see the
# production manifest's own header comment for the full account.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-service
  namespace: itunda-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: card-service
  template:
    metadata:
      labels:
        app: card-service
    spec:
      enableServiceLinks: false
      containers:
      - name: card-service
        image: ghcr.io/itunda-rw/card-service:staging
        ports:
        - containerPort: 4002
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: port
        - name: DB_NAME
          value: "itunda"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: port
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: itunda-jwt-secret
              key: secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "350m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 4002
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 4002
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 4002
          initialDelaySeconds: 45
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: card-service
  namespace: itunda-staging
spec:
  selector:
    app: card-service
  ports:
  - port: 4002
    targetPort: 4002
  type: ClusterIP
