apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: itunda
spec:
  replicas: 3
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      # See infra/k8s/local-dev/kafka.yaml's comment on enableServiceLinks.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: api-gateway
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: api-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api-gateway
        image: ghcr.io/itunda-rw/api-gateway:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - containerPort: 3000
        # In-cluster Service DNS names for the three backends this gateway proxies
        # to (2026-07-11 fix, alongside services/api-gateway/index.js's move away
        # from hardcoded localhost -- see backend.yaml/ledger-service.yaml/
        # payment-service.yaml, all in this same directory).
        env:
        - name: BACKEND_URL
          value: "http://backend:4001"
        - name: CARD_SERVICE_URL
          value: "http://card-service:4002"
        - name: INSURANCE_SERVICE_URL
          value: "http://insurance-service:4003"
        - name: AGENTS_SERVICE_URL
          value: "http://agents-service:4004"
        - name: TRANSIT_SERVICE_URL
          value: "http://transit-service:4005"
        - name: CERTIFICATE_SERVICE_URL
          value: "http://certificate-service:4006"
        - name: BILLS_SERVICE_URL
          value: "http://bills-service:4007"
        - name: VEHICLE_SERVICE_URL
          value: "http://vehicle-service:4008"
        - name: PARTNERS_SERVICE_URL
          value: "http://partners-service:4009"
        - name: IDENTITY_SERVICE_URL
          value: "http://identity-service:4010"
        - name: OVERVIEW_SERVICE_URL
          value: "http://overview-service:4011"
        - name: LEDGER_SERVICE_URL
          value: "http://ledger-service:8082"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8081"
        - name: UPSTREAM_TIMEOUT_MS
          value: "15000"
        - name: CORS_ALLOWED_ORIGINS
          value: "https://itunda.duckdns.org,http://localhost:3000,http://localhost:5000,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5005"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          failureThreshold: 12
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: itunda
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
