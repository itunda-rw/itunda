# Cross-cutting cluster policy for the itunda namespace: autoscaling, disruption
# budgets, network isolation, and resource quotas. Split out from the
# per-service manifests (api-gateway.yaml/backend.yaml/ledger-service.yaml/
# payment-service.yaml) because these apply at the namespace/fleet level rather
# than describing one deployable.
#
# NetworkPolicy requires a CNI that enforces it (Calico, Cilium, etc.) -- kind's
# default kindnet does NOT enforce NetworkPolicy, so these are real manifests that
# express real intent, but on a stock kind cluster they apply without error and
# without actually restricting traffic. Documented here rather than silently
# assumed, the same honesty convention the rest of this repo's infra docs follow.

# ---------- HorizontalPodAutoscaler ----------
# minReplicas/maxReplicas capped at 1 for every service (2026-08-11) -- real live
# incident, not a precaution: these 4 HPAs had scaleTargetRef.kind: Deployment while
# backend/api-gateway/ledger-service/payment-service were actually argoproj.io/v1alpha1
# Rollout resources, a real kind mismatch that meant these HPAs had silently never
# worked at all until this same pass converted the Rollouts to real Deployments (see
# each service's own manifest). The very first time they DID start working, they
# scaled backend to 4-5 concurrent replicas on a single 4-CPU/5.8Gi node -- each JVM
# replica alone needs ~1.5Gi, so 4 replicas already exceeds total node memory before
# anything else on the box is counted. Measured result: node load hit 179 (on 4
# cores), memory dropped to 94Mi free, kubectl itself became unreachable, and the VM
# needed a hard restart to recover. There is no real high-availability benefit to
# multiple replicas on a single point-of-failure node anyway -- if the node goes down,
# every replica goes down with it regardless of count. minReplicas: 1/maxReplicas: 1
# effectively disables autoscaling here on purpose; revisit only if this ever becomes
# a genuine multi-node cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: itunda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: itunda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-service
  namespace: itunda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  namespace: itunda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

# ---------- NetworkPolicy ----------
# Default deny all ingress in the namespace, then explicitly allow only the paths
# this system actually uses: internet -> api-gateway, api-gateway -> {backend,
# ledger-service, payment-service}, everything -> DNS. Nothing is allowed to reach
# backend/ledger-service/payment-service directly except the gateway -- closing the
# "any authenticated caller can reach internal services directly" shape of gap
# flagged in SECURITY.md, at the network layer rather than the application layer.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: itunda
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: itunda
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
  - Ingress
  ingress:
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backend
  namespace: itunda
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - port: 4001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-ledger-service
  namespace: itunda
spec:
  podSelector:
    matchLabels:
      app: ledger-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-payment-service
  namespace: itunda
spec:
  podSelector:
    matchLabels:
      app: payment-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stateful-deps-ingress
  namespace: itunda
spec:
  # mysql/redis/kafka/zookeeper only exist in infra/k8s/local-dev (see that
  # directory's README) -- a real cluster points DB_HOST/REDIS_HOST/
  # KAFKA_BOOTSTRAP_SERVERS at managed services outside the cluster instead, so
  # this policy is only meaningful when local-dev's manifests are also applied.
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [mysql, redis, kafka, zookeeper]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values: [backend, ledger-service, payment-service, kafka]

# ---------- ResourceQuota / LimitRange ----------
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: itunda-quota
  namespace: itunda
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "60"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: itunda-limits
  namespace: itunda
spec:
  limits:
  - type: Container
    # Defaults raised 2026-07-27 (cpu 500m->2, memory 512Mi->2Gi, defaultRequest.memory
    # 128Mi->256Mi) after a real cgroup cpu.stat check showed the backend container
    # throttled in 49% of scheduling periods under the old 500m-equivalent cap --
    # invisible to a JVM thread dump (a throttled thread still shows RUNNABLE, it's
    # just not scheduled by the kernel). Also discovered live: patching this LimitRange
    # does NOT retroactively fix already-scheduled pods, and a pod created in the
    # narrow window between two related patches can get stamped with a stale
    # intermediate default permanently -- always verify the ACTUAL running pod's
    # resources (not just this spec) after a multi-step change like this one.
    #
    # Lowered back 2026-08-11 -- backend-rollout.yaml now declares its own explicit
    # limits (1536Mi/1500m, sized to its real observed usage, see that file's own doc
    # comment for the full account) instead of relying on this default, which is what
    # made the 2Gi default matter in practice: nothing else in this namespace omits
    # its own limits, so this default was only ever actually governing backend, and a
    # single container allowed to claim over a third of a 5.8Gi single-node cluster's
    # total memory was a real, measured contributor to a live crash-loop incident
    # (kube-controller-manager/kube-scheduler/argo-rollouts/backend all restarting
    # every few minutes). This is now purely a defense-in-depth default for any
    # future container that forgets to set its own limits -- matching the other 3
    # itunda services' own explicit 500m/512Mi (api-gateway-rollout.yaml/
    # ledger-service-rollout.yaml/payment-service-rollout.yaml), not re-litigating
    # the CPU-throttling fix those never needed a raised default to avoid.
    default:
      cpu: "500m"
      memory: 512Mi
    defaultRequest:
      cpu: "100m"
      memory: 256Mi
