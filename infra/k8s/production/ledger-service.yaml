# services/microservices/ledger-service -- the independently-deployable, real
# hexagonal-architecture ledger service (double-entry TransferService, Kafka
# outbox). Added 2026-07-11 alongside backend.yaml/payment-service.yaml -- see
# backend.yaml's header comment for the secrets/ConfigMap provisioning convention
# these manifests all share.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: itunda
spec:
  replicas: 2
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      # See infra/k8s/local-dev/kafka.yaml's comment on enableServiceLinks.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: ledger-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: ledger-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: ledger-service
        image: ghcr.io/itunda-rw/ledger-service:latest
        ports:
        - containerPort: 8082
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-microservices-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-microservices-db-config
              key: port
        - name: DB_NAME
          value: "itunda_ledger"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: itunda-kafka-config
              key: bootstrap-servers
        resources:
          requests:
            memory: "384Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        # See backend.yaml's comment on startupProbe -- same slow-cold-start-vs-
        # liveness-probe race hit deploying every Spring Boot service here.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 45
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: itunda
spec:
  selector:
    app: ledger-service
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP
