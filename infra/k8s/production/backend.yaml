# The canonical Kotlin/Spring Boot backend (services/backend) -- auth, wallet,
# transfer, bills, loans, contacts, stocks, savings, insurance, notifications,
# discover, system. Added 2026-07-11: previously the only k8s manifest that
# existed in this repo deployed api-gateway, a 24-line Node.js proxy -- the
# service actually holding the real business logic and ledger had no deployment
# story at all.
#
# Secrets referenced below (itunda-db-credentials, itunda-jwt-secret) are NOT
# created by this file on purpose -- committing real credentials to a YAML file
# in git is exactly the anti-pattern this repo's own SECURITY.md exists to catch
# elsewhere. Provision them out-of-band, e.g.:
#   kubectl create secret generic itunda-db-credentials \
#     --from-literal=username=itunda --from-literal=password=<real value> -n itunda
#   kubectl create secret generic itunda-jwt-secret \
#     --from-literal=secret=<real value> -n itunda
#
# DB_HOST/DB_PORT point at an external managed MySQL instance via itunda-db-config
# (a ConfigMap, also provisioned out-of-band) -- this manifest deliberately does
# not attempt to run production MySQL as a Kubernetes StatefulSet itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: itunda
spec:
  replicas: 2
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "4001"
    spec:
      # See infra/k8s/local-dev/kafka.yaml's comment: Kubernetes auto-injects
      # Service-name-derived env vars into every pod in the namespace, which can
      # silently collide with an app's own env vars. Nothing here reads those, so
      # there's no reason to accept them.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: ghcr.io/itunda/backend:latest
        ports:
        - containerPort: 4001
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: port
        - name: DB_NAME
          value: "itunda"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: port
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: itunda-kafka-config
              key: bootstrap-servers
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: itunda-jwt-secret
              key: secret
        - name: ITUNDA_CORS_ALLOWED_ORIGINS
          value: "https://itunda.duckdns.org,http://localhost:5000,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5005"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # Real bug hit deploying this (2026-07-11): a Spring Boot cold start under
        # real load (JPA repository scanning, Flyway, Hibernate bootstrap) can take
        # well over a minute, especially on a resource-constrained node -- with only
        # a livenessProbe and no startupProbe, kubelet was killing the container via
        # the *liveness* probe's tighter budget before Spring Boot ever got to
        # /actuator/health for the first time (`Container backend failed liveness
        # probe, will be restarted`, seen live), so it never got a chance to start at
        # all -- CrashLoopBackOff on a container that was never actually broken.
        # startupProbe owns the "give it time to boot" budget (up to 5 minutes);
        # readiness/liveness only start being evaluated after startupProbe succeeds
        # once.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 4001
          initialDelaySeconds: 45
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: itunda
spec:
  selector:
    app: backend
  ports:
  - port: 4001
    targetPort: 4001
  type: ClusterIP
