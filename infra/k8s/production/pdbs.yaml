# Prevent voluntary disruptions from draining every replica of a service at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: itunda
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: itunda
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-service
  namespace: itunda
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ledger-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service
  namespace: itunda
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment-service
