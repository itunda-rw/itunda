# services/backend/loans-service -- the fourteenth independently-deployable
# itunda product (2026-09-06, Bank product-completeness pass, see
# docs/ARCHITECTURE.md's dated follow-up). Runs the exact same :loans/:core/
# :auth/:security modules the `backend` Deployment does, against the SAME
# itunda-db-config/itunda-db-credentials schema (not a separate per-service
# database), just as its own JVM/bootJar/Deployment so a Loans-only build/deploy
# never needs to touch or restart `backend`'s pod. See backend.yaml's own header
# comment for the secrets/ConfigMap provisioning convention shared here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loans-service
  namespace: itunda
spec:
  replicas: 1
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: loans-service
  template:
    metadata:
      labels:
        app: loans-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "4015"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: loans-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: loans-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: loans-service
        image: ghcr.io/itunda-rw/loans-service:latest
        ports:
        - containerPort: 4015
        env:
        # Deliberately the SAME schema `backend` uses -- itunda-db-config, not
        # ledger-service/payment-service's separate itunda-microservices-db-config.
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-db-config
              key: port
        - name: DB_NAME
          value: "itunda"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itunda-db-credentials
              key: password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: itunda-redis-config
              key: port
        # Must be the exact same secret `backend` uses -- a JWT `backend`'s
        # AuthService mints has to validate here too (shared :security filter
        # chain, see SecurityConfig's own doc comment).
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: itunda-jwt-secret
              key: secret
        resources:
          requests:
            memory: "384Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        # See backend.yaml's own extensive comments on why all three probes exist
        # and their exact timings -- same cold-start/probe-timeout/node-contention
        # class of real incidents this single overcommitted node has already hit
        # more than once, so this mirrors backend.yaml's/card-service.yaml's tuned
        # values rather than untuned defaults.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 4015
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 4015
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 4015
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: loans-service
  namespace: itunda
spec:
  selector:
    app: loans-service
  ports:
  - port: 4015
    targetPort: 4015
  type: ClusterIP
