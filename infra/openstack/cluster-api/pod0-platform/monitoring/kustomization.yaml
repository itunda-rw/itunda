apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - base/prometheus.yaml
  - base/grafana.yaml
  - base/node-exporter.yaml
patches:
  - path: prometheus-config-mimir.patch.yaml
    target:
      kind: ConfigMap
      name: prometheus-config
      namespace: monitoring
  - path: grafana-datasources-mimir.patch.yaml
    target:
      kind: ConfigMap
      name: grafana-datasources
      namespace: monitoring
