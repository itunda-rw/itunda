# Pod0 long-term metrics storage for the Toss-style private-cloud target.
#
# Source-backed assumptions:
# - Toss explicitly calls out Prometheus, Mimir, and Grafana in the private-cloud monitoring path.
# - Grafana documents that production deployments should use the `mimir-distributed` Helm chart,
#   while monolithic mode is mainly for getting started or development.
# - The default chart values use a test MinIO deployment and are not production-oriented.
#
# Replace every placeholder before use.

minio:
  enabled: false

global:
  extraEnvFrom:
    - secretRef:
        name: mimir-object-storage

mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          endpoint: ${MIMIR_S3_ENDPOINT}
          bucket_name: ${MIMIR_BLOCKS_BUCKET}
          access_key_id: ${MIMIR_S3_ACCESS_KEY_ID}
          secret_access_key: ${MIMIR_S3_SECRET_ACCESS_KEY}
    blocks_storage:
      backend: s3
      s3:
        endpoint: ${MIMIR_S3_ENDPOINT}
        bucket_name: ${MIMIR_BLOCKS_BUCKET}
        access_key_id: ${MIMIR_S3_ACCESS_KEY_ID}
        secret_access_key: ${MIMIR_S3_SECRET_ACCESS_KEY}
    alertmanager_storage:
      backend: s3
      s3:
        endpoint: ${MIMIR_S3_ENDPOINT}
        bucket_name: ${MIMIR_ALERTMANAGER_BUCKET}
        access_key_id: ${MIMIR_S3_ACCESS_KEY_ID}
        secret_access_key: ${MIMIR_S3_SECRET_ACCESS_KEY}
    ruler_storage:
      backend: s3
      s3:
        endpoint: ${MIMIR_S3_ENDPOINT}
        bucket_name: ${MIMIR_RULER_BUCKET}
        access_key_id: ${MIMIR_S3_ACCESS_KEY_ID}
        secret_access_key: ${MIMIR_S3_SECRET_ACCESS_KEY}

gateway:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: mimir.platform.itunda.internal
        paths:
          - path: /
    tls:
      - secretName: mimir-platform-itunda-tls
        hosts:
          - mimir.platform.itunda.internal

alertmanager:
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: cinder-csi

compactor:
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: cinder-csi

ingester:
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: cinder-csi

store_gateway:
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: cinder-csi

metaMonitoring:
  dashboards:
    enabled: true
