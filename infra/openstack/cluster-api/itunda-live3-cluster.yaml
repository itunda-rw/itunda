apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: itunda-live3
  namespace: capo-itunda
  labels:
    itunda.io/pod: pod1-live
    itunda.io/live-zone: live3
    itunda.io/role: workload
    itunda.io/provider: openstack
    itunda.io/openstack-workload: "true"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 10.32.0.0/16
    services:
      cidrBlocks:
      - 10.100.0.0/16
    serviceDomain: cluster.local
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: KubeadmControlPlane
    name: itunda-live3-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: OpenStackCluster
    name: itunda-live3
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackCluster
metadata:
  name: itunda-live3
  namespace: capo-itunda
  labels:
    itunda.io/pod: pod1-live
    itunda.io/live-zone: live3
    itunda.io/role: workload
spec:
  apiServer:
    managedLoadBalancer:
      enabled: true
  externalNetwork:
    id: "REPLACE_WITH_OPENSTACK_EXTERNAL_NETWORK_ID"
  identityRef:
    cloudName: openstack
    name: openstack-cloud-config
  managedSubnets:
  - cidr: 10.32.0.0/24
    dnsNameservers:
    - 1.1.1.1
    - 8.8.8.8
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackMachineTemplate
metadata:
  name: itunda-live3-control-plane
  namespace: capo-itunda
spec:
  template:
    spec:
      flavor:
        filter:
          name: c2.medium
      image:
        filter:
          name: ubuntu-2204-kube-v1.32
      sshKeyName: itunda-private-cloud
      availabilityZone: pod1-az1
      serverMetadata:
        pod: pod1-live
        live-zone: live3
        failure-domain: dc-a
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: itunda-live3-control-plane
  namespace: capo-itunda
spec:
  replicas: 3
  version: v1.32.4
  machineTemplate:
    metadata:
      labels:
        itunda.io/pod: pod1-live
        itunda.io/live-zone: live3
        itunda.io/node-pool: control-plane
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: OpenStackMachineTemplate
      name: itunda-live3-control-plane
    nodeDrainTimeout: 5m
    nodeDeletionTimeout: 10m
    nodeVolumeDetachTimeout: 10m
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        extraArgs:
          cloud-provider: external
      controllerManager:
        extraArgs:
          cloud-provider: external
    initConfiguration:
      nodeRegistration:
        name: '{{ local_hostname }}'
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
        - name: provider-id
          value: openstack://'{{ instance_id }}'
    joinConfiguration:
      nodeRegistration:
        name: '{{ local_hostname }}'
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
        - name: provider-id
          value: openstack://'{{ instance_id }}'
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: itunda-live3-workers
  namespace: capo-itunda
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ local_hostname }}'
          kubeletExtraArgs:
          - name: cloud-provider
            value: external
          - name: provider-id
            value: openstack://'{{ instance_id }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: OpenStackMachineTemplate
metadata:
  name: itunda-live3-workers
  namespace: capo-itunda
spec:
  template:
    spec:
      flavor:
        filter:
          name: c2.large
      image:
        filter:
          name: ubuntu-2204-kube-v1.32
      sshKeyName: itunda-private-cloud
      availabilityZone: pod1-az1
      serverMetadata:
        pod: pod1-live
        live-zone: live3
        failure-domain: dc-a
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: itunda-live3-workers
  namespace: capo-itunda
spec:
  clusterName: itunda-live3
  replicas: 4
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: itunda-live3-workers
  template:
    metadata:
      labels:
        cluster.x-k8s.io/deployment-name: itunda-live3-workers
        itunda.io/pod: pod1-live
        itunda.io/live-zone: live3
        itunda.io/node-pool: workers
    spec:
      clusterName: itunda-live3
      version: v1.32.4
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: itunda-live3-workers
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: OpenStackMachineTemplate
        name: itunda-live3-workers
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: itunda-live3-control-plane
  namespace: capo-itunda
spec:
  clusterName: itunda-live3
  maxUnhealthy: 100%
  nodeStartupTimeout: 20m
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: itunda-live3
      cluster.x-k8s.io/control-plane: ""
  unhealthyConditions:
  - type: Ready
    status: Unknown
    timeout: 300s
  - type: Ready
    status: "False"
    timeout: 300s
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: itunda-live3-workers
  namespace: capo-itunda
spec:
  clusterName: itunda-live3
  maxUnhealthy: 40%
  nodeStartupTimeout: 20m
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: itunda-live3
      cluster.x-k8s.io/deployment-name: itunda-live3-workers
  unhealthyConditions:
  - type: Ready
    status: Unknown
    timeout: 300s
  - type: Ready
    status: "False"
    timeout: 300s
