apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: itunda
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  SERVICE_DISCOVERY: "kubernetes"
  ENVIRONMENT: "production"
  API_GATEWAY_PORT: "3000"
  SERVICE_PORT: "3001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: itunda
data:
  KAFKA_BROKERS: "kafka-0.kafka.itunda.svc.cluster.local:9092,kafka-1.kafka.itunda.svc.cluster.local:9092,kafka-2.kafka.itunda.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP: "itunda-services"
  KAFKA_PARTITIONS: "10"
  KAFKA_REPLICATION_FACTOR: "3"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: itunda
data:
  ELASTICSEARCH_URL: "http://elasticsearch.itunda-logging.svc.cluster.local:9200"
  ELASTICSEARCH_INDEX_PREFIX: "itunda"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: itunda
data:
  REDIS_URL: "redis://redis-0.redis.itunda.svc.cluster.local:6379"
  REDIS_CLUSTER: "true"
  REDIS_DB: "0"
