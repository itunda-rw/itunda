android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8

# Real React Native Gradle Plugin config. Key added 2026-07-12 (granite-adoption
# stage 2) -- ItundaApplication.kt's and packages/saronite/README.md's prior
# comments claiming "newArchEnabled=false ... see android/gradle.properties" were
# false citations at the time (confirmed by direct inspection: no such key
# existed) -- Old Architecture was old only by omission, not by explicit config.
# Flipped to true 2026-07-12 (granite-adoption stage 4): real @granite-js
# packages' native bridge (brick-module's BrickModulePackage) extends
# TurboReactPackage and forces isTurboModule=true -- confirmed by reading its
# actual source in an isolated create-granite-app scaffold (stage 1) -- so New
# Architecture is not optional for real granite adoption. This is also the step
# most likely to reproduce the original libreact_featureflagsjni.so crash that
# forced the 0.80.3 -> 0.72.17 downgrade in the first place; stage 2/3's real
# CMake build step (confirmed running via :app:configureCMakeDebug/buildCMakeDebug
# for all 4 ABIs) is what that crash's root cause was actually missing, so this
# flip is verified live on-device immediately after, not assumed safe.
newArchEnabled=true
hermesEnabled=true
