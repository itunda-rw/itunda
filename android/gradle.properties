android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8

# Real React Native Gradle Plugin config (2026-07-12, granite-adoption stage 2).
# This key did not exist anywhere in this repo before this line -- ItundaApplication.kt's
# and packages/saronite/README.md's prior comments claiming "newArchEnabled=false ...
# see android/gradle.properties" were false citations (confirmed by direct inspection: no
# such key existed). Old Architecture was previously old only by omission -- nothing
# opted into New Architecture, which RN 0.72 doesn't default to. Now it's a real,
# explicit false, matching what those comments always claimed. Flipping this to true is
# stage 4 of the granite-adoption plan, not this one.
newArchEnabled=false
hermesEnabled=true
